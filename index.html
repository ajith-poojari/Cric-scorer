    const roster = battingTeam.players.concat(battingTeam.substitutes || []);
    const available = roster.filter(p=> !inn.dismissedOrder.includes(p.id) && p.id!==state.strikerId && p.id!==state.nonStrikerId);
    const sel = el('select');
    available.forEach(p=>{ const opt=el('option','',displayPlayerName(p.id)); opt.value=p.id; sel.appendChild(opt); });
    m.appendChild(sel);
    const actions = el('div','modal-actions');
    const confirm = el('button','btn btn-primary','Send to Crease');
    confirm.type = 'button';
    confirm.onclick = ()=>confirmNewBatsman(sel.value);
    actions.appendChild(confirm);
    m.appendChild(actions);
  }

  if(state.modal.type==='newBowler'){
    m.appendChild(el('h3','Select Bowler for Over ' + (Math.floor(legalBallCount(inn)/6) + 1)));
    const bowlingTeam = getTeam(inn.bowlingTeam);
    const maxOv = getMaxOversPerBowler();
    const eligible = bowlingTeam.players.filter(p=>{
      if(p.id===state.previousBowlerId) return false;
      const oversBowled = parseInt(bowlingStatsFor(inn, p.id).overs.split('.')[0]);
      return oversBowled < maxOv;
    });
    const list = eligible.length ? eligible : bowlingTeam.players.filter(p=>p.id!==state.previousBowlerId);
    if(!eligible.length){
      m.appendChild(el('div','helptext','All other bowlers have reached the '+maxOv+'-over quota for '+state.format+' — showing remaining bowlers.'));
    }
    const sel = el('select');
    list.forEach(p=>{
      const bs = bowlingStatsFor(inn, p.id);
      const label = displayPlayerName(p.id) + (isFinite(maxOv) ? ' — '+bs.overs+'/'+maxOv+' ov ('+bs.wkts+'W, '+bs.runs+'R)' : '');
      const opt=el('option','',label); opt.value=p.id; sel.appendChild(opt);
    });
    m.appendChild(sel);
    const actions = el('div','modal-actions');
    if (state.bowlerId) {
      const cancel = el('button', 'btn btn-ghost', 'Cancel');
      cancel.type = 'button';
      cancel.onclick = () => { state.modal = null; render(); };
      actions.appendChild(cancel);
    }
    const confirm = el('button','btn btn-primary','Confirm Bowler');
    confirm.type = 'button';
    confirm.onclick = ()=>confirmNewBowler(sel.value);
    actions.appendChild(confirm);
    m.appendChild(actions);
  }

  backdrop.appendChild(m);
  return backdrop;
}

/* =========================================================
   ENHANCED SCORE GRAPH & ANALYTICS SUITE
   ========================================================= */
function computeOverSummaries(inn) {
  const maxOverSeen = inn.deliveries.reduce((m, d) => Math.max(m, d.overNum || 1), 0);
  const summaries = [];
  let cumRuns = 0;
  let cumWkts = 0;
  for (let o = 1; o <= maxOverSeen; o++) {
    const delivs = inn.deliveries.filter(d => d.overNum === o);
    const runsInOver = delivs.reduce((s, d) => s + d.runsOffBat + d.extraRuns, 0);
    const wktsInOver = delivs.filter(d => d.wicket).length;
    const wicketsList = delivs.filter(d => d.wicket).map(d => displayPlayerName(d.wicket.dismissedId));
    const bowlerId = delivs.length ? delivs[0].bowlerId : null;
    cumRuns += runsInOver;
    cumWkts += wktsInOver;
    const crr = (cumRuns / o).toFixed(2);
    summaries.push({
      over: o,
      runs: runsInOver,
      wkts: wktsInOver,
      wicketsList,
      cumRuns,
      cumWkts,
      crr: parseFloat(crr),
      bowlerName: bowlerId ? displayPlayerName(bowlerId) : '—',
      balls: delivs.map(d => {
        if (d.wicket) return 'W';
        if (d.extraType) return d.extraType + (d.extraRuns > 1 ? d.extraRuns : '');
        return d.runsOffBat.toString();
      })
    });
  }
  return summaries;
}

function cumulativeRunsByBall(inn) {
  const points = [{ x: 0, y: 0, wicket: null, overNum: 0 }];
  let cum = 0, legal = 0;
  (inn.deliveries || []).forEach(d => {
    cum += d.runsOffBat + d.extraRuns;
    if (d.legal) legal++;
    points.push({
      x: legal / 6,
      y: cum,
      overNum: d.overNum,
      wicket: d.wicket ? {
        player: displayPlayerName(d.wicket.dismissedId),
        score: cum,
        over: Math.floor(legal / 6) + '.' + (legal % 6)
      } : null
    });
  });
  return points;
}

function buildInteractiveScoreGraph() {
  const activeInnings = state.innings.filter(inn => inn.deliveries && inn.deliveries.length > 0);
  if (!activeInnings.length) return null;

  const series = state.innings.map((inn, idx) => ({
    idx,
    label: getTeam(inn.battingTeam).name || ('Innings ' + (idx + 1)),
    color: idx === 0 ? '#10b981' : '#38bdf8',
    fillId: idx === 0 ? 'gradEmerald' : 'gradSky',
    points: cumulativeRunsByBall(inn),
    overs: computeOverSummaries(inn),
    target: inn.target
  })).filter(s => s.points.length > 1);

  if (!series.length) return null;

  const maxOversGraph = Math.max(
    Math.min(state.maxOvers, 20),
    ...series.map(s => Math.ceil(s.points[s.points.length - 1].x)),
    6
  );

  const width = 680, height = 270, padL = 44, padR = 20, padT = 20, padB = 34;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  let svg = '<svg viewBox="0 0 ' + width + ' ' + height + '" style="width:100%;height:auto;display:block;overflow:visible;">';
  svg += '<defs>' +
    '<linearGradient id="gradEmerald" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>' +
      '<stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>' +
    '</linearGradient>' +
    '<linearGradient id="gradSky" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>' +
      '<stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>' +
    '</linearGradient>' +
  '</defs>';

  if (state.chartMode === 'worm') {
    const rawMaxY = Math.max(
      20,
      ...series.map(s => Math.max(...s.points.map(p => p.y))),
      ...(series.map(s => s.target || 0))
    );
    const maxY = Math.ceil((rawMaxY * 1.12) / 10) * 10;
    const xScale = x => padL + (x / maxOversGraph) * plotW;
    const yScale = y => padT + plotH - (y / maxY) * plotH;

    /* Gridlines */
    const yTicks = 4;
    for (let i = 0; i <= yTicks; i++) {
      const val = Math.round((maxY / yTicks) * i);
      const y = yScale(val);
      svg += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (padL + plotW) + '" y2="' + y.toFixed(1) + '" stroke="#1e293b" stroke-width="1" stroke-dasharray="' + (i === 0 ? '' : '3 3') + '"/>';
      svg += '<text x="' + (padL - 8) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="10" fill="#94a3b8" text-anchor="end" font-family="Space Mono, monospace">' + val + '</text>';
    }

    const xStep = maxOversGraph > 30 ? 5 : maxOversGraph > 12 ? 2 : 1;
    for (let o = 0; o <= maxOversGraph; o += xStep) {
      const x = xScale(o);
      svg += '<line x1="' + x.toFixed(1) + '" y1="' + padT + '" x2="' + x.toFixed(1) + '" y2="' + (padT + plotH) + '" stroke="#1e293b" stroke-width="0.6"/>';
      svg += '<text x="' + x.toFixed(1) + '" y="' + (padT + plotH + 18) + '" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="Space Mono, monospace">Ov ' + o + '</text>';
    }

    /* Target Line if chasing */
    const chaseTarget = series.find(s => s.target)?.target;
    if (chaseTarget && chaseTarget <= maxY) {
      const ty = yScale(chaseTarget);
      svg += '<line x1="' + padL + '" y1="' + ty.toFixed(1) + '" x2="' + (padL + plotW) + '" y2="' + ty.toFixed(1) + '" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>';
      svg += '<text x="' + (padL + plotW - 4) + '" y="' + (ty - 5).toFixed(1) + '" font-size="9.5" fill="#fbbf24" text-anchor="end" font-family="Space Mono, monospace" font-weight="700">TARGET ' + chaseTarget + '</text>';
    }

    /* Selected Over Vertical Highlight */
    if (state.selectedOverInspect) {
      const hx = xScale(state.selectedOverInspect);
      svg += '<line x1="' + hx.toFixed(1) + '" y1="' + padT + '" x2="' + hx.toFixed(1) + '" y2="' + (padT + plotH) + '" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2"/>';
    }

    /* Area & Line Paths + Wicket Markers */
    series.forEach(s => {
      const coords = s.points.map(p => [xScale(p.x), yScale(p.y)]);
      const lineD = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
      const lastX = coords[coords.length - 1][0];
      const areaD = lineD + ' L' + lastX.toFixed(1) + ',' + (padT + plotH) + ' L' + padL + ',' + (padT + plotH) + ' Z';
      svg += '<path d="' + areaD + '" fill="url(#' + s.fillId + ')"/>';
      svg += '<path d="' + lineD + '" fill="none" stroke="' + s.color + '" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>';

      /* End point pulse */
      const endPt = coords[coords.length - 1];
      svg += '<circle cx="' + endPt[0].toFixed(1) + '" cy="' + endPt[1].toFixed(1) + '" r="4" fill="' + s.color + '" stroke="#060b14" stroke-width="1.5"/>';

      /* Wicket markers on curve */
      s.points.forEach(p => {
        if (p.wicket) {
          const wx = xScale(p.x), wy = yScale(p.y);
          svg += '<g>' +
            '<circle cx="' + wx.toFixed(1) + '" cy="' + wy.toFixed(1) + '" r="6.5" fill="#e11d48" stroke="#ffffff" stroke-width="1.4"/>' +
            '<text x="' + wx.toFixed(1) + '" y="' + (wy + 3).toFixed(1) + '" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Inter, sans-serif">W</text>' +
          '</g>';
        }
      });
    });
  } else if (state.chartMode === 'manhattan') {
    const maxOverBar = Math.max(6, ...series.map(s => s.overs.length));
    const maxRunsInOver = Math.max(12, ...series.flatMap(s => s.overs.map(o => o.runs)));
    const maxY = Math.ceil((maxRunsInOver * 1.2) / 4) * 4;
    const yScale = y => padT + plotH - (y / maxY) * plotH;

    for (let i = 0; i <= 4; i++) {
      const val = Math.round((maxY / 4) * i);
      const y = yScale(val);
      svg += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (padL + plotW) + '" y2="' + y.toFixed(1) + '" stroke="#1e293b" stroke-width="1" stroke-dasharray="' + (i === 0 ? '' : '3 3') + '"/>';
      svg += '<text x="' + (padL - 8) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="10" fill="#94a3b8" text-anchor="end" font-family="Space Mono, monospace">' + val + '</text>';
    }

    const slotW = plotW / maxOverBar;
    const barW = Math.min(14, Math.max(4, (slotW - 6) / series.length));

    for (let o = 1; o <= maxOverBar; o++) {
      const groupCenterX = padL + (o - 0.5) * slotW;
      if (state.selectedOverInspect === o) {
        svg += '<rect x="' + (padL + (o - 1) * slotW).toFixed(1) + '" y="' + padT + '" width="' + slotW.toFixed(1) + '" height="' + plotH + '" fill="rgba(16,185,129,0.08)"/>';
      }
      series.forEach((s, sIdx) => {
        const ovObj = s.overs.find(item => item.over === o);
        if (!ovObj) return;
        const bx = groupCenterX - (series.length * barW) / 2 + sIdx * barW;
        const by = yScale(ovObj.runs);
        const bh = Math.max(2, padT + plotH - by);
        svg += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + (barW - 1.5).toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="2.5" fill="' + s.color + '"/>';
        if (ovObj.wkts > 0) {
          const cx = bx + (barW - 1.5) / 2;
          const cy = Math.max(padT + 7, by - 8);
          svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5.5" fill="#e11d48" stroke="#060b14" stroke-width="1"/>';
          svg += '<text x="' + cx.toFixed(1) + '" y="' + (cy + 2.5).toFixed(1) + '" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">W</text>';
        }
      });
      if (maxOverBar <= 20 || o % 2 === 1 || o === maxOverBar) {
        svg += '<text x="' + groupCenterX.toFixed(1) + '" y="' + (padT + plotH + 18) + '" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-family="Space Mono, monospace">' + o + '</text>';
      }
    }
  } else {
    /* Run Rate Wave (CRR Progression by Over) */
    const maxOverRR = Math.max(6, ...series.map(s => s.overs.length));
    const maxRR = Math.max(12, ...series.flatMap(s => s.overs.map(o => o.crr)));
    const maxY = Math.ceil(maxRR * 1.15);
    const xScale = o => padL + ((o - 0.5) / maxOverRR) * plotW;
    const yScale = y => padT + plotH - (Math.min(maxY, y) / maxY) * plotH;

    for (let i = 0; i <= 4; i++) {
      const val = ((maxY / 4) * i).toFixed(1);
      const y = yScale(parseFloat(val));
      svg += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (padL + plotW) + '" y2="' + y.toFixed(1) + '" stroke="#1e293b" stroke-width="1" stroke-dasharray="' + (i === 0 ? '' : '3 3') + '"/>';
      svg += '<text x="' + (padL - 8) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="9.5" fill="#94a3b8" text-anchor="end" font-family="Space Mono, monospace">' + val + '</text>';
    }

    series.forEach(s => {
      if (!s.overs.length) return;
      const pts = s.overs.map(o => [xScale(o.over), yScale(o.crr)]);
      const dPath = pts.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
      svg += '<path d="' + dPath + '" fill="none" stroke="' + s.color + '" stroke-width="2.6" stroke-linecap="round"/>';
      pts.forEach(c => {
        svg += '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="3.5" fill="' + s.color + '" stroke="#060b14" stroke-width="1.2"/>';
      });
    });

    for (let o = 1; o <= maxOverRR; o++) {
      if (maxOverRR <= 20 || o % 2 === 1) {
        svg += '<text x="' + xScale(o).toFixed(1) + '" y="' + (padT + plotH + 18) + '" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-family="Space Mono, monospace">Ov ' + o + '</text>';
      }
    }
  }

  svg += '</svg>';
  return { svg, series };
}

function computePartnerships(inn) {
  const list = [];
  let curRuns = 0, curBalls = 0;
  let b1 = null, b2 = null;
  (inn.deliveries || []).forEach(d => {
    if (!b1) b1 = d.strikerId;
    if (!b2) b2 = d.nonStrikerId;
    curRuns += d.runsOffBat + d.extraRuns;
    if (d.legal) curBalls++;
    if (d.wicket) {
      list.push({
        batters: displayPlayerName(b1) + ' & ' + displayPlayerName(b2),
        runs: curRuns,
        balls: curBalls,
        unbroken: false
      });
      curRuns = 0; curBalls = 0; b1 = null; b2 = null;
    }
  });
  if (curBalls > 0 || curRuns > 0) {
    list.push({
      batters: displayPlayerName(b1 || state.strikerId) + ' & ' + displayPlayerName(b2 || state.nonStrikerId),
      runs: curRuns,
      balls: curBalls,
      unbroken: true
    });
  }
  return list;
}

function computePhases(inn) {
  const p1 = { name: 'Powerplay (Ov 1–6)', runs: 0, wkts: 0, balls: 0 };
  const p2 = { name: 'Middle Overs (Ov 7–15)', runs: 0, wkts: 0, balls: 0 };
  const p3 = { name: 'Death Overs (Ov 16+)', runs: 0, wkts: 0, balls: 0 };
  (inn.deliveries || []).forEach(d => {
    const target = d.overNum <= 6 ? p1 : d.overNum <= 15 ? p2 : p3;
    target.runs += d.runsOffBat + d.extraRuns;
    if (d.wicket) target.wkts++;
    if (d.legal) target.balls++;
  });
  return [p1, p2, p3];
}

function matchBattingLeaders(){
  const all = [];
  state.innings.forEach(inn=>{
    const team = getTeam(inn.battingTeam);
    const facedIds = [...new Set(inn.deliveries.map(d=>d.strikerId))];
    team.players.concat(team.substitutes||[]).filter(p=>facedIds.includes(p.id)).forEach(p=>{
      const st = battingStatsFor(inn,p.id);
      all.push({ name: displayPlayerName(p.id), runs: st.runs, balls: st.balls });
    });
  });
  return all.sort((a,b)=>b.runs-a.runs).slice(0,3);
}
function matchBowlingLeaders(){
  const all = [];
  state.innings.forEach(inn=>{
    const team = getTeam(inn.bowlingTeam);
    const bowledIds = [...new Set(inn.deliveries.map(d=>d.bowlerId))];
    team.players.concat(team.substitutes||[]).filter(p=>bowledIds.includes(p.id)).forEach(p=>{
      const bs = bowlingStatsFor(inn,p.id);
      all.push({ name: displayPlayerName(p.id), wkts: bs.wkts, runs: bs.runs, overs: bs.overs });
    });
  });
  return all.sort((a,b)=> b.wkts-a.wkts || a.runs-b.runs).slice(0,3);
}

async function generateScorecardImage(){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080, H=1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#10b981';
  ctx.fillRect(0,0,W,12);

  const inn1 = state.innings[0], inn2 = state.innings[1];
  const team1 = inn1 ? getTeam(inn1.battingTeam) : state.teamA;
  const team2 = inn2 ? getTeam(inn2.battingTeam) : state.teamB;

  let y = 90;
  ctx.fillStyle = '#94a3b8';
  ctx.font = '600 28px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('MATCH SCORECARD · ' + (state.venue || 'SCOREBOARD LIVE'), W/2, y);

  y += 70;
  ctx.fillStyle = '#f8fafc';
  ctx.font = '800 46px Inter, sans-serif';
  ctx.fillText((team1.name||'Team A')+' vs '+(team2.name||'Team B'), W/2, y);

  y += 90;
  [[team1,inn1],[team2,inn2]].forEach(([team,inn])=>{
    if (!inn) return;
    ctx.font = '600 32px Inter, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'left';
    ctx.fillText(team.name||'Team', 90, y);
    ctx.textAlign = 'right';
    ctx.font = "700 40px 'Space Mono', monospace";
    ctx.fillStyle = '#10b981';
    ctx.fillText(teamTotal(inn)+'/'+teamWickets(inn)+'  ('+oversStr(inn)+' ov)', W-90, y);
    y += 60;
  });

  if (inn1 && inn2) {
    y += 20;
    const t1 = teamTotal(inn1), t2 = teamTotal(inn2);
    let resultText;
    if (state.matchComplete) {
      if(t2>t1) resultText = (team2.name||'Team 2')+' won by '+(10-teamWickets(inn2))+' wickets';
      else if(t1>t2) resultText = (team1.name||'Team 1')+' won by '+(t1-t2)+' runs';
      else resultText = 'Match tied';
    } else {
      resultText = (team2.name||'Team 2') + ' need ' + Math.max(0, (t1 + 1) - t2) + ' runs to win';
    }
    ctx.textAlign = 'center';
    ctx.font = '700 30px Inter, sans-serif';
    ctx.fillStyle = '#fbbf24';
    ctx.fillText(resultText, W/2, y);
  }

  y += 70;
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(90,y); ctx.lineTo(W-90,y); ctx.stroke();

  y += 60;
  ctx.textAlign = 'left';
  ctx.font = '700 26px Inter, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('TOP BATTING', 90, y);
  y += 50;
  matchBattingLeaders().forEach(b=>{
    ctx.font = '600 28px Inter, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'left';
    ctx.fillText(b.name, 90, y);
    ctx.font = "700 28px 'Space Mono', monospace";
    ctx.fillStyle = '#10b981';
    ctx.textAlign = 'right';
    ctx.fillText(b.runs+' ('+b.balls+')', W-90, y);
    y += 48;
  });

  y += 30;
  ctx.textAlign = 'left';
  ctx.font = '700 26px Inter, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('TOP BOWLING', 90, y);
  y += 50;
  matchBowlingLeaders().forEach(b=>{
    ctx.font = '600 28px Inter, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'left';
    ctx.fillText(b.name, 90, y);
    ctx.font = "700 28px 'Space Mono', monospace";
    ctx.fillStyle = '#38bdf8';
    ctx.textAlign = 'right';
    ctx.fillText(b.wkts+'/'+b.runs+' ('+b.overs+')', W-90, y);
    y += 48;
  });

  ctx.textAlign = 'center';
  ctx.font = '500 22px Inter, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('Scored live with Scoreboard · Match ' + (state.matchCode || ''), W/2, H-50);

  return new Promise(resolve=>{ canvas.toBlob(blob=>resolve(blob), 'image/png'); });
}

async function shareScorecardImage(){
  showToast('Generating HD Scorecard Poster…');
  const blob = await generateScorecardImage();
  if(!blob) return;
  const file = new File([blob], 'scorecard.png', { type:'image/png' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:'Match scorecard' }); return; }
    catch(e){}
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'scorecard-' + (state.matchCode || 'match') + '.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('Scorecard PNG downloaded!');
}

function renderViewer(){
  const frag = el('div');

  /* 1. Enhanced Interactive Score Graph Card FIRST on Scoreboard for immediate broadcast impact */
  const graphData = buildInteractiveScoreGraph();
  if (graphData) {
    const wormPaper = el('div', 'paper');
    const cHeader = el('div', 'chart-header');
    const titleWrap = el('div');
    titleWrap.innerHTML =
      '<div class="innings-tag" style="margin-bottom:4px;">LIVE TELEMETRY</div>' +
      '<div style="font-size:18px;font-weight:800;color:#ffffff;">Score &amp; Run Rate Progression Graph</div>';
    cHeader.appendChild(titleWrap);

    const tabs = el('div', 'chart-tabs');
    [
      ['worm', 'Worm (Cumulative)'],
      ['manhattan', 'Manhattan (Per Over)'],
      ['runrate', 'Run Rate Wave']
    ].forEach(([modeKey, modeLabel]) => {
      const tb = el('button', 'chart-tab' + (state.chartMode === modeKey ? ' active' : ''), modeLabel);
      tb.type = 'button';
      tb.onclick = () => { state.chartMode = modeKey; render(); };
      tabs.appendChild(tb);
    });
    cHeader.appendChild(tabs);
    wormPaper.appendChild(cHeader);

    /* Legend + Wicket Badge Key */
    const legend = el('div', '');
    legend.style.display = 'flex';
    legend.style.flexWrap = 'wrap';
    legend.style.alignItems = 'center';
    legend.style.justifyContent = 'space-between';
    legend.style.gap = '10px';
    legend.style.marginBottom = '10px';

    const leftLeg = el('div', '');
    leftLeg.innerHTML = graphData.series.map(ds =>
      '<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:12px;color:#e2e8f0;font-weight:700;">' +
      '<span style="width:12px;height:12px;border-radius:3px;background:' + ds.color + ';display:inline-block;"></span>' +
      ds.label + ' (' + ds.points[ds.points.length - 1].y + ')' +
      '</span>'
    ).join('') +
    '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#fda4af;font-weight:600;">' +
      '<span style="width:14px;height:14px;border-radius:50%;background:#e11d48;color:#fff;font-size:8px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;">W</span> Wicket' +
    '</span>';
    legend.appendChild(leftLeg);
    wormPaper.appendChild(legend);

    const svgWrap = el('div');
    svgWrap.innerHTML = graphData.svg;
    wormPaper.appendChild(svgWrap);

    /* Interactive Over Scrubber & Telemetry Inspector */
    const maxOverAvailable = Math.max(...graphData.series.map(s => s.overs.length), 0);
    if (maxOverAvailable > 0) {
      const activeOver = state.selectedOverInspect || maxOverAvailable;
      const scrubberLabel = el('div', 'ctrl-label', 'TAP ANY OVER TO INSPECT TELEMETRY (OVER ' + activeOver + ')');
      scrubberLabel.style.marginTop = '14px';
      scrubberLabel.style.marginBottom = '6px';
      wormPaper.appendChild(scrubberLabel);

      const scrubber = el('div', 'over-scrubber');
      for (let o = 1; o <= maxOverAvailable; o++) {
        const hasWicket = graphData.series.some(s => {
          const found = s.overs.find(item => item.over === o);
          return found && found.wkts > 0;
        });
        const chipBtn = el('button', 'over-chip' + (activeOver === o ? ' active' : '') + (hasWicket ? ' has-w' : ''), 'Ov ' + o + (hasWicket ? ' •W' : ''));
        chipBtn.type = 'button';
        chipBtn.onclick = () => {
          state.selectedOverInspect = o;
          render();
        };
        scrubber.appendChild(chipBtn);
      }
      wormPaper.appendChild(scrubber);

      const inspector = el('div', 'chart-inspector');
      const inspectHtml = graphData.series.map(s => {
        const ov = s.overs.find(item => item.over === activeOver);
        if (!ov) return '<div style="font-size:12px;color:#64748b;">' + s.label + ': Over ' + activeOver + ' not bowled yet</div>';
        return '<div style="flex:1 1 240px;">' +
          '<div style="font-size:12px;font-weight:700;color:' + s.color + ';">' + s.label + ' — Over ' + activeOver + ' (' + ov.bowlerName + ')</div>' +
          '<div class="num" style="font-size:13px;color:#f8fafc;margin-top:3px;">' +
            '<strong>+' + ov.runs + ' runs</strong>' + (ov.wkts ? ' · <span style="color:#fda4af;font-weight:700;">' + ov.wkts + 'W (' + ov.wicketsList.join(', ') + ')</span>' : '') +
            ' · Total: ' + ov.cumRuns + '/' + ov.cumWkts + ' (CRR ' + ov.crr.toFixed(2) + ')' +
          '</div>' +
          '<div class="num" style="font-size:11px;color:#94a3b8;margin-top:2px;">Balls: [' + ov.balls.join(' · ') + ']</div>' +
        '</div>';
      }).join('');
      inspector.innerHTML = inspectHtml;
      wormPaper.appendChild(inspector);
    }

    frag.appendChild(wormPaper);
  }

  /* 2. Full Batting, Bowling, Phase Split & Partnerships per Innings */
  state.innings.forEach((inn, idx)=>{
    const battingTeam = getTeam(inn.battingTeam);
    const bowlingTeam = getTeam(inn.bowlingTeam);
    const paper = el('div','paper');
    paper.appendChild(el('div','innings-tag','INNINGS '+(idx+1) + (inn.target ? ' · TARGET ' + inn.target : '')));

    const totalExtras = inn.deliveries.reduce((s, d) => s + d.extraRuns, 0);
    paper.appendChild(el('h3',
      '<span>' + battingTeam.name + '</span>' +
      '<span class="num" style="color:#34d399;">' + teamTotal(inn)+'/'+teamWickets(inn)+' <span style="font-size:13px;color:#94a3b8;">('+oversStr(inn)+' ov · Extras '+totalExtras+')</span></span>'
    ));

    const tableWrap = el('div', 'table-wrap');
    const table = el('table');
    const thead = el('thead');
    thead.innerHTML = '<tr><th>Batter</th><th>Status</th><th class="num">R</th><th class="num">B</th><th class="num">4s</th><th class="num">6s</th><th class="num">SR</th></tr>';
    table.appendChild(thead);
    const tbody = el('tbody');
    const facedIds = [...new Set(inn.deliveries.map(d=>d.strikerId).concat(
      idx === state.currentInnings ? [state.strikerId, state.nonStrikerId].filter(Boolean) : []
    ))];

    battingTeam.players.concat(battingTeam.substitutes || []).filter(p=>facedIds.includes(p.id)).forEach(p=>{
      const st = battingStatsFor(inn, p.id);
      const outInfo = inn.deliveries.find(d=>d.wicket && d.wicket.dismissedId===p.id);
      let dismissal = 'not out';
      if(outInfo){
        const fielder = outInfo.wicket.fielderId ? displayPlayerName(outInfo.wicket.fielderId) : null;
        const bowler = outInfo.bowlerId ? displayPlayerName(outInfo.bowlerId) : null;
        if (outInfo.wicket.dismissalType === 'Caught') {
          dismissal = 'c ' + (fielder || 'sub') + ' b ' + (bowler || '');
        } else if (outInfo.wicket.dismissalType === 'Bowled') {
          dismissal = 'b ' + (bowler || '');
        } else if (outInfo.wicket.dismissalType === 'LBW') {
          dismissal = 'lbw b ' + (bowler || '');
        } else if (outInfo.wicket.dismissalType === 'Stumped') {
          dismissal = 'st ' + (fielder || 'wk') + ' b ' + (bowler || '');
        } else {
          dismissal = outInfo.wicket.dismissalType + (fielder ? ' (' + fielder + ')' : '');
        }
      }
      const isAtCrease = idx === state.currentInnings && !outInfo && (p.id === state.strikerId || p.id === state.nonStrikerId);
      const tr = el('tr');
      tr.innerHTML =
        '<td style="font-weight:700;color:' + (isAtCrease ? '#34d399' : '#ffffff') + ';">' +
          displayPlayerName(p.id) + (p.id === state.strikerId && isAtCrease ? ' ★' : '') +
        '</td>' +
        '<td class="dismissal">' + dismissal + '</td>' +
        '<td class="num" style="font-weight:700;color:#34d399;">'+st.runs+'</td><td class="num">'+st.balls+'</td>'+
        '<td class="num">'+st.fours+'</td><td class="num">'+st.sixes+'</td><td class="num">'+st.sr+'</td>';
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    paper.appendChild(tableWrap);

    /* Phase Breakdown Cards */
    const phases = computePhases(inn).filter(ph => ph.balls > 0);
    if (phases.length) {
      paper.appendChild(el('div', 'team-list-title', 'Scoring by Match Phase'));
      const pGrid = el('div', 'phase-grid');
      phases.forEach(ph => {
        const pc = el('div', 'phase-card');
        const rr = (ph.runs / (ph.balls / 6)).toFixed(2);
        pc.innerHTML =
          '<div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;">' + ph.name + '</div>' +
          '<div class="num" style="font-size:18px;font-weight:800;color:#f8fafc;margin-top:4px;">' + ph.runs + '/' + ph.wkts + ' <span style="font-size:12px;color:#34d399;">(RR ' + rr + ')</span></div>';
        pGrid.appendChild(pc);
      });
      paper.appendChild(pGrid);
    }

    if(inn.fow.length){
      paper.appendChild(el('div','team-list-title','Fall of Wickets'));
      const fowLine = inn.fow.map((f, i)=> f.score+'-'+(i+1)+' ('+f.player+', '+f.over+' ov)').join('  ·  ');
      paper.appendChild(el('div','fow-row', fowLine));
    }

    /* Partnerships */
    const parts = computePartnerships(inn);
    if (parts.length) {
      paper.appendChild(el('div', 'team-list-title', 'Partnerships'));
      const partWrap = el('div', 'fow-row');
      partWrap.innerHTML = parts.map((pt, pIdx) =>
        '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:' + (pIdx === parts.length - 1 ? 'none' : '1px solid #1e293b') + ';">' +
          '<span><strong style="color:#f8fafc;">' + (pIdx + 1) + '.</strong> ' + pt.batters + (pt.unbroken ? ' <span style="color:#34d399;font-size:11px;">(unbroken)</span>' : '') + '</span>' +
          '<span class="num" style="color:#38bdf8;font-weight:700;">' + pt.runs + ' (' + pt.balls + 'b)</span>' +
        '</div>'
      ).join('');
      paper.appendChild(partWrap);
    }

    paper.appendChild(el('div','team-list-title','Bowling — '+bowlingTeam.name));
    const bWrap = el('div', 'table-wrap');
    const btable = el('table');
    const bthead = el('thead');
    bthead.innerHTML = '<tr><th>Bowler</th><th class="num">O</th><th class="num">M</th><th class="num">R</th><th class="num">W</th><th class="num">Econ</th></tr>';
    btable.appendChild(bthead);
    const btbody = el('tbody');
    const bowledIds = [...new Set(inn.deliveries.map(d=>d.bowlerId))];
    bowlingTeam.players.concat(bowlingTeam.substitutes || []).filter(p=>bowledIds.includes(p.id)).forEach(p=>{
      const bs = bowlingStatsFor(inn, p.id);
      const tr = el('tr');
      tr.innerHTML = '<td style="font-weight:700;color:#ffffff;">'+displayPlayerName(p.id)+'</td><td class="num">'+bs.overs+'</td><td class="num">'+bs.maidens+'</td><td class="num">'+bs.runs+'</td><td class="num" style="font-weight:700;color:#38bdf8;">'+bs.wkts+'</td><td class="num">'+bs.econ+'</td>';
      btbody.appendChild(tr);
    });
    btable.appendChild(btbody);
    bWrap.appendChild(btable);
    paper.appendChild(bWrap);
    frag.appendChild(paper);
  });

  if(state.matchComplete && state.innings.length===2){
    const inn1 = state.innings[0], inn2 = state.innings[1];
    const t1 = teamTotal(inn1), t2 = teamTotal(inn2);
    const team1 = getTeam(inn1.battingTeam), team2 = getTeam(inn2.battingTeam);
    const summary = el('div','paper');
    let text;
    if(t2>t1) text = (team2.name||'Team 2')+' won by '+(10-teamWickets(inn2))+' wickets';
    else if(t1>t2) text = (team1.name||'Team 1')+' won by '+(t1-t2)+' runs';
    else text = 'Match tied';
    summary.appendChild(el('h3','Official Match Result'));
    summary.appendChild(el('div','', '<span style="font-size:20px;font-weight:800;color:#fbbf24;">🏆 '+text+'</span>'));
    const btnRow = el('div', '');
    btnRow.style.display = 'flex';
    btnRow.style.flexWrap = 'wrap';
    btnRow.style.gap = '10px';
    btnRow.style.marginTop = '16px';
    const shareBtn = el('button','btn btn-primary','📸 Download / Share Scorecard Poster');
    shareBtn.type = 'button';
    shareBtn.onclick = ()=>{ shareScorecardImage(); };
    btnRow.appendChild(shareBtn);

    const jsonBtn = el('button', 'btn btn-ghost', '💾 Export Match JSON');
    jsonBtn.type = 'button';
    jsonBtn.onclick = () => exportMatchJson();
    btnRow.appendChild(jsonBtn);
    summary.appendChild(btnRow);
    frag.appendChild(summary);
  } else if(state.innings.length > 0 && !state.matchComplete){
    const paper = el('div','paper');
    paper.style.display = 'flex';
    paper.style.flexWrap = 'wrap';
    paper.style.justifyContent = 'space-between';
    paper.style.alignItems = 'center';
    paper.style.gap = '12px';
    paper.appendChild(el('div','empty-note','Match in progress — official result will lock once the second innings concludes.'));
    const posterNow = el('button', 'btn btn-ghost', '📸 Save Live Scorecard Image');
    posterNow.type = 'button';
    posterNow.onclick = () => shareScorecardImage();
    paper.appendChild(posterNow);
    frag.appendChild(paper);
  }

  if(state.innings.length===0){
    const paper = el('div','paper');
    paper.appendChild(el('div','empty-note','No innings data yet — set up and start a match to see the scorecard.'));
    frag.appendChild(paper);
  }
  return frag;
}

(function prefillFromUrl(){
  try {
    const params = new URLSearchParams(window.location.search);
    const codeParam = params.get('code');
    if(codeParam){
      state.tempCode = codeParam.toUpperCase();
      state.tempRole = 'viewer';
    }
  } catch (e) {}
})();
render();
</script>
</body>
</html>
