<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    background-color: #060b14;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -15%, rgba(16, 185, 129, 0.12), transparent),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(56, 189, 248, 0.06), transparent);
    color: #f1f5f9;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.42; cursor: not-allowed; }
  input, select { font-family: inherit; }

  .num { font-family: 'Space Mono', monospace; font-variant-numeric: tabular-nums; }
  .serif { font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.02em; }

  /* ---------- Layout Shell ---------- */
  .app {
    width: 100%;
    max-width: 1060px;
    margin: 0 auto;
    padding: 18px 14px 72px;
    overflow-x: hidden;
  }

  /* ---------- Top Navigation Bar ---------- */
  .topline {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: rgba(11, 18, 32, 0.92);
    backdrop-filter: blur(12px);
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 12px 16px;
    margin-bottom: 18px;
    box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.55);
  }
  .brand-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: none;
    padding: 4px 6px;
    margin: -4px -6px;
    border-radius: 10px;
    text-align: left;
    color: inherit;
  }
  .brand-btn:hover { background: rgba(30, 41, 59, 0.5); }
  .brand-btn:hover .brand-word { color: #34d399; }
  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.08));
    border: 1px solid rgba(16, 185, 129, 0.38);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
  }
  .brand {
    font-size: clamp(16px, 3vw, 19px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #ffffff;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .brand-word { transition: color 0.15s ease; }
  .brand-dot { color: #34d399; }
  .brand-tag {
    color: #94a3b8;
    font-weight: 500;
    font-size: 12.5px;
  }
  .nav-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .subnav {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #060b14;
    padding: 4px;
    border-radius: 12px;
    border: 1px solid #1e293b;
    max-width: 100%;
    overflow-x: auto;
  }
  .subnav-btn {
    background: transparent;
    border: 1px solid transparent;
    color: #94a3b8;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .subnav-btn:hover { color: #f1f5f9; background: rgba(30, 41, 59, 0.45); }
  .subnav-btn.active {
    background: rgba(16, 185, 129, 0.16);
    color: #34d399;
    border-color: rgba(16, 185, 129, 0.35);
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.15);
  }
  .pause-trigger-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #111c2d;
    border: 1px solid #334155;
    color: #f8fafc;
    font-size: 12.5px;
    font-weight: 700;
    padding: 7px 13px;
    border-radius: 11px;
    white-space: nowrap;
  }
  .pause-trigger-btn:hover {
    border-color: #38bdf8;
    background: #1e293b;
  }
  .pause-trigger-btn.is-paused {
    background: rgba(245, 158, 11, 0.16);
    border-color: rgba(245, 158, 11, 0.45);
    color: #fbbf24;
  }

  /* ---------- Status & Pause Banners ---------- */
  .pause-live-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: linear-gradient(90deg, rgba(245, 158, 11, 0.18), rgba(217, 119, 6, 0.08));
    border: 1px solid rgba(245, 158, 11, 0.45);
    color: #fde68a;
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 600;
  }
  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    display: inline-block;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    animation: pulseGlow 1.8s infinite;
  }
  .pulse-dot.amber {
    background: #f59e0b;
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.92); }
  }

  /* ---------- Setup Wizard & Connect Card ---------- */
  .clipboard {
    background: #0b1220;
    color: #f1f5f9;
    border: 1px solid #1e293b;
    border-radius: 18px;
    padding: 26px 22px;
    max-width: 700px;
    margin: 0 auto;
    box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.6);
  }
  .step-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #34d399;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.28);
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .clipboard h2 {
    margin: 0 0 20px;
    padding-bottom: 12px;
    font-size: clamp(20px, 3.5vw, 24px);
    font-weight: 800;
    color: #ffffff;
    border-bottom: 1px solid #1e293b;
    letter-spacing: -0.02em;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #94a3b8;
    margin-bottom: 8px;
  }
  .field input[type=text],
  .field input[type=number],
  .field input[type=password],
  .field select {
    width: 100%;
    max-width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #060b14;
    color: #f1f5f9;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus, .field select:focus {
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
  }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .choice-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .choice {
    border: 1px solid #334155;
    background: #060b14;
    color: #cbd5e1;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .choice:hover { border-color: #475569; background: #162235; }
  .choice.active {
    background: #059669;
    color: #ffffff;
    border-color: #10b981;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
  }
  .player-row {
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 0.9fr) minmax(0, 1.1fr);
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .player-row input, .player-row select {
    width: 100%;
    min-width: 0;
    padding: 9px 10px;
    font-size: 13px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #060b14;
    color: #f1f5f9;
    outline: none;
  }
  .player-row input:focus, .player-row select:focus { border-color: #10b981; }
  .wizard-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #1e293b;
  }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 11px 20px;
    font-size: 13.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: #059669;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
  }
  .btn-primary:hover { background: #10b981; }
  .btn-ghost {
    background: #162235;
    color: #cbd5e1;
    border: 1px solid #334155;
  }
  .btn-ghost:hover { background: #1e293b; color: #ffffff; border-color: #475569; }
  .btn-danger {
    background: rgba(225, 29, 72, 0.16);
    color: #fda4af;
    border: 1px solid rgba(244, 63, 94, 0.4);
  }
  .btn-danger:hover { background: #e11d48; color: #ffffff; }
  .btn-amber {
    background: rgba(245, 158, 11, 0.16);
    color: #fcd34d;
    border: 1px solid rgba(245, 158, 11, 0.4);
  }
  .btn-amber:hover { background: #f59e0b; color: #060b14; }

  .team-list-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #34d399;
    margin: 22px 0 8px;
    padding-top: 14px;
    border-top: 1px solid #1e293b;
  }
  .helptext { font-size: 12.5px; color: #94a3b8; margin-top: 4px; margin-bottom: 14px; line-height: 1.5; }

  .error-banner {
    background: rgba(225, 29, 72, 0.14);
    border: 1px solid rgba(244, 63, 94, 0.45);
    color: #fecdd3;
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 12px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  /* ---------- Broadcast Scoreboard Hero ---------- */
  .board {
    background: linear-gradient(155deg, #0f172a 0%, #090f1d 100%);
    border: 1px solid #1e293b;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 18px 36px -8px rgba(0, 0, 0, 0.6);
  }
  .board-top {
    display: grid;
    grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr) minmax(0, 1fr);
    gap: 14px;
    padding: 20px 22px;
    border-bottom: 1px solid #1e293b;
    align-items: center;
  }
  .board-teams {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #34d399;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .board-score {
    font-size: clamp(34px, 6vw, 48px);
    color: #ffffff;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .board-sub { font-size: 12.5px; color: #94a3b8; margin-top: 8px; font-weight: 500; }
  .board-stat {
    text-align: right;
    background: rgba(6, 11, 20, 0.65);
    border: 1px solid #1e293b;
    padding: 12px 14px;
    border-radius: 12px;
  }
  .board-stat .label {
    font-size: 10.5px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .board-stat .value {
    font-size: clamp(18px, 3vw, 23px);
    font-weight: 700;
    color: #f8fafc;
    margin-top: 3px;
  }
  .board-mid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  .player-panel { padding: 18px 22px; border-right: 1px solid #1e293b; min-width: 0; }
  .player-panel:last-child { border-right: none; }
  .panel-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #94a3b8;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .p-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(30, 41, 59, 0.55);
  }
  .p-line:last-child { border-bottom: none; }
  .p-line .name {
    color: #f1f5f9;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .p-line .name.strike { color: #34d399; font-weight: 700; }
  .p-line .name.strike::after { content: " ★"; color: #fbbf24; font-size: 12px; }
  .p-line .figs {
    color: #cbd5e1;
    font-size: 12px;
    background: #060b14;
    padding: 4px 9px;
    border-radius: 8px;
    border: 1px solid #1e293b;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .freehit-banner {
    background: linear-gradient(90deg, #e11d48, #be123c);
    color: #ffffff;
    text-align: center;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ---------- Controls Keypad ---------- */
  .controls {
    background: #0b1220;
    border: 1px solid #1e293b;
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.5);
  }
  .ctrl-toprow {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #1e293b;
  }
  .ctrl-section { margin-bottom: 16px; }
  .ctrl-section:last-child { margin-bottom: 0; }
  .ctrl-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #94a3b8;
    margin-bottom: 9px;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid #334155;
    background: #060b14;
    color: #f8fafc;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 700;
    min-width: 52px;
    flex: 1 1 auto;
    max-width: 110px;
    text-align: center;
  }
  .chip:hover:not(:disabled) { background: #162235; border-color: #10b981; }
  .chip.boundary-4 { border-color: rgba(56, 189, 248, 0.4); color: #38bdf8; }
  .chip.boundary-6 { border-color: rgba(16, 185, 129, 0.45); color: #34d399; }
  .chip.extra {
    border-color: rgba(245, 158, 11, 0.35);
    background: rgba(245, 158, 11, 0.09);
    color: #fcd34d;
    font-weight: 600;
    font-size: 13.5px;
    max-width: 140px;
  }
  .chip.extra:hover:not(:disabled) { background: rgba(245, 158, 11, 0.18); }
  .chip.wicket {
    border-color: #f43f5e;
    background: #e11d48;
    color: #ffffff;
    font-weight: 700;
    padding: 12px 22px;
    max-width: 200px;
  }
  .chip.wicket:hover:not(:disabled) { background: #f43f5e; }
  .chip.undo {
    border-color: #334155;
    background: #162235;
    color: #cbd5e1;
    font-size: 12px;
    padding: 8px 13px;
    flex: 0 0 auto;
    max-width: none;
  }
  .over-timeline { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
  .ball-pill {
    min-width: 32px;
    height: 32px;
    padding: 0 6px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    border: 1px solid #334155;
    background: #060b14;
    color: #e2e8f0;
  }
  .ball-pill.b4 { background: rgba(56, 189, 248, 0.18); border-color: #38bdf8; color: #7dd3fc; }
  .ball-pill.b6 { background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #6ee7b7; }
  .ball-pill.w { background: #e11d48; border-color: #f43f5e; color: #ffffff; }
  .ball-pill.x { background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.5); color: #fcd34d; }

  /* ---------- Modals & Pause Menu ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.84);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 14px;
    overflow-y: auto;
  }
  .modal {
    background: #0b1220;
    color: #f1f5f9;
    border: 1px solid #1e293b;
    border-radius: 18px;
    padding: 22px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
  }
  .modal.wide-modal { max-width: 620px; }
  .modal h3 { margin: 0 0 12px; font-size: 18px; font-weight: 800; color: #ffffff; }
  .modal select, .modal input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #060b14;
    color: #f1f5f9;
    font-size: 14px;
  }
  .modal-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid #1e293b;
  }
  .pause-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .pause-card-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #060b14;
    border: 1px solid #1e293b;
    color: #f1f5f9;
    text-align: left;
  }
  .pause-card-btn:hover:not(:disabled) {
    border-color: #10b981;
    background: #111c2d;
  }
  .pause-card-btn .p-title { font-size: 13px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 6px; }
  .pause-card-btn .p-desc { font-size: 11px; color: #94a3b8; line-height: 1.35; }

  /* ---------- Viewer Scorecard & Analytics ---------- */
  .paper {
    background: #0b1220;
    color: #f1f5f9;
    border: 1px solid #1e293b;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.45);
  }

<script>
document.getElementById('copyright-year').textContent = new Date().getFullYear();

const firebaseConfig = {
  apiKey: "__FIREBASE_API_KEY__",
  authDomain: "__FIREBASE_AUTH_DOMAIN__",
  databaseURL: "__FIREBASE_DATABASE_URL__",
  projectId: "__FIREBASE_PROJECT_ID__",
  storageBucket: "__FIREBASE_STORAGE_BUCKET__",
  messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
  appId: "__FIREBASE_APP_ID__",
  measurementId: "__FIREBASE_MEASUREMENT_ID__"
};

/* Detect whether GitHub Actions has injected live Firebase secrets */
const isLocalPreview = firebaseConfig.databaseURL.startsWith('__FIREBASE_') || !firebaseConfig.databaseURL;
let db = null;
let syncRef = null;

if (!isLocalPreview && typeof firebase !== 'undefined') {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (err) {
    console.warn('Firebase initialization skipped or failed:', err);
  }
}

/* =========================================================
   WEB AUDIO SYNTHESIZER (Subtle Broadcast Feedback)
   ========================================================= */
let audioCtx = null;
function playTone(kind) {
  if (!state.soundEnabled) return;
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    if (!audioCtx) audioCtx = new AudioContextClass();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (kind === 'boundary') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.08);
      osc.frequency.setValueAtTime(783.99, now + 0.16);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (kind === 'wicket') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(140, now + 0.3);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc.start(now);
      osc.stop(now + 0.32);
    } else if (kind === 'error') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(180, now + 0.1);
      gain.gain.setValueAtTime(0.07, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.035, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now);
      osc.stop(now + 0.06);
    }
  } catch (e) {}
}

let toastTimer = null;
function showToast(message, isError) {
  const wrap = document.getElementById('toast-container');
  if (!wrap) return;
  wrap.style.display = 'block';
  wrap.innerHTML = '';
  const box = el('div', 'toast-msg');
  if (isError) {
    box.style.borderColor = '#f43f5e';
    box.style.color = '#fecdd3';
  }
  box.textContent = message;
  wrap.appendChild(box);
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    wrap.style.display = 'none';
  }, 3400);
}

/* =========================================================
   LOCAL STORAGE MATCH & ROSTER PERSISTENCE
   ========================================================= */
function saveMatchToLocal(code, payload) {
  if (!code) return;
  try {
    localStorage.setItem('scoreboard_match_' + code.toUpperCase(), JSON.stringify(payload));
  } catch (e) {}
}

function getMatchFromLocal(code) {
  if (!code) return null;
  try {
    const raw = localStorage.getItem('scoreboard_match_' + code.toUpperCase());
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function listLocalMatchCodes() {
  const codes = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('scoreboard_match_')) {
        codes.push(k.replace('scoreboard_match_', ''));
      }
    }
  } catch (e) {}
  return codes;
}

function buildJoinUrl(code){
  try {
    const url = new URL(window.location.href);
    url.search = '';
    url.searchParams.set('code', code);
    return url.toString();
  } catch (e) {
    return 'https://scoreboard.app/?code=' + encodeURIComponent(code);
  }
}

function attachQRCodes(){
  document.querySelectorAll('[data-qr]').forEach(elNode=>{
    const text = elNode.getAttribute('data-qr');
    const size = parseInt(elNode.getAttribute('data-qr-size') || '140');
    elNode.innerHTML = '';
    if(window.QRCode){
      try {
        new QRCode(elNode, { text, width: size, height: size, colorDark:'#0f172a', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
      } catch(e) {}
    }
  });
}

async function loadSavedRosters(){
  let localRosters = [];
  try {
    localRosters = JSON.parse(localStorage.getItem('scoreboard_saved_rosters') || '[]');
  } catch (e) {}

  if(!db || !firebase.auth || !firebase.auth().currentUser){
    state.savedRosters = localRosters;
    render();
    return;
  }
  try{
    const uid = firebase.auth().currentUser.uid;
    const snap = await db.ref('rosters/'+uid).once('value');
    const data = snap.val() || {};
    const remoteRosters = Object.keys(data).map(id=>Object.assign({id}, data[id]));
    state.savedRosters = remoteRosters.length ? remoteRosters : localRosters;
    render();
  }catch(e){
    state.savedRosters = localRosters;
    render();
  }
}

async function saveRoster(teamKey, name){
  const team = getTeam(teamKey);
  const payload = {
    id: 'r_' + Date.now(),
    name: (name || team.name || 'Unnamed roster').trim(),
    players: JSON.parse(JSON.stringify(team.players)),
    substitutes: JSON.parse(JSON.stringify(team.substitutes)),
    savedAt: Date.now()
  };
  try {
    const existing = JSON.parse(localStorage.getItem('scoreboard_saved_rosters') || '[]');
    existing.unshift(payload);
    localStorage.setItem('scoreboard_saved_rosters', JSON.stringify(existing.slice(0, 20)));
  } catch (e) {}

  if(db && firebase.auth && firebase.auth().currentUser){
    try {
      const uid = firebase.auth().currentUser.uid;
      const ref = db.ref('rosters/'+uid).push();
      await ref.set(payload);
    } catch (e) {}
  }
  state.savedRosters = null;
  showToast('Roster "' + payload.name + '" saved!');
  render();
}

function applyRoster(teamKey, rosterId){
  const roster = (state.savedRosters||[]).find(r=>r.id===rosterId);
  if(!roster) return;
  const team = getTeam(teamKey);
  team.name = roster.name;
  team.players = JSON.parse(JSON.stringify(roster.players));
  team.substitutes = JSON.parse(JSON.stringify(roster.substitutes));
  showToast('Loaded roster "' + roster.name + '"');
  render();
}

function generateMatchCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function hashPassword(pw){
  if (window.crypto && window.crypto.subtle) {
    try {
      const enc = new TextEncoder().encode(pw);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    } catch (e) {}
  }
  return btoa(unescape(encodeURIComponent(pw)));
}

/* =========================================================
   STATE & DEMO MATCH BUILDER
   ========================================================= */
const BOWLING_ROLES = ['Fast','Fast Medium','Medium Fast','Medium','Off Spin','Leg Spin','Left-arm Orthodox','Left-arm Chinaman','—'];

function makeDefaultPlayers(prefix){
  const arr = [];
  for(let i=1;i<=11;i++){
    arr.push({ id: prefix+i, name: '', battingStyle:'RHB', bowlingRole:'Fast' });
  }
  return arr;
}
function makeSubstitutes(prefix){
  const arr = [];
  for(let i=1;i<=2;i++){
    arr.push({ id: prefix+'SUB'+i, name: '', battingStyle:'RHB', bowlingRole:'Fast', isSub:true });
  }
  return arr;
}

const initialAdminCode = generateMatchCode();

let state = {
  role: null,             // 'admin' | 'viewer'
  matchCode: null,
  connected: false,
  connecting: false,
  connectError: null,
  showQrModal: false,
  showPauseMenu: false,
  legalModal: null,       // 'privacy' | 'terms' | 'support' | null
  matchPaused: false,
  pauseReason: 'Drinks Break',
  soundEnabled: true,
  chartMode: 'worm',      // 'worm' | 'manhattan' | 'runrate'
  selectedOverInspect: null,
  savedRosters: null,
  tempRosterSaveName: { A:'', B:'' },
  tempRole: 'admin',
  adminDraftCode: initialAdminCode,
  tempCode: initialAdminCode,
  tempPassword: '',
  scorerPasswordHash: null,
  view: 'setup',
  step: 1,
  format: 'T20',
  maxOvers: 20,
  venue: '',
  pitch: 'Dry',
  weather: 'Clear',
  teamA: { name: 'Team A', players: makeDefaultPlayers('A'), substitutes: makeSubstitutes('A') },
  teamB: { name: 'Team B', players: makeDefaultPlayers('B'), substitutes: makeSubstitutes('B') },
  tossWinner: null,
  tossDecision: null,
  strikerId: null, nonStrikerId: null, bowlerId: null,
  previousBowlerId: null,
  innings: [],
  currentInnings: 0,
  freeHit: false,
  matchComplete: false,
  history: [],
  modal: null
};

/* Ensure empty arrays stripped by Firebase Realtime Database are safely restored */
function normalizeMatchData(data) {
  if (!data) return data;
  const copy = Object.assign({}, data);
  copy.innings = (copy.innings || []).map(inn => Object.assign({
    deliveries: [],
    fow: [],
    dismissedOrder: [],
    battingOrderInPlay: [],
    outBatsmen: {},
    target: null
  }, inn, {
    deliveries: inn.deliveries || [],
    fow: inn.fow || [],
    dismissedOrder: inn.dismissedOrder || []
  }));
  if (copy.teamA) {
    copy.teamA.players = copy.teamA.players || makeDefaultPlayers('A');
    copy.teamA.substitutes = copy.teamA.substitutes || makeSubstitutes('A');
  }
  if (copy.teamB) {
    copy.teamB.players = copy.teamB.players || makeDefaultPlayers('B');
    copy.teamB.substitutes = copy.teamB.substitutes || makeSubstitutes('B');
  }
  return copy;
}

function buildSyncPayload(){
  return {
    admin_uid: (!isLocalPreview && firebase.auth && firebase.auth().currentUser) ? firebase.auth().currentUser.uid : 'local-admin',
    scorer_password_hash: state.scorerPasswordHash || null,
    format: state.format, maxOvers: state.maxOvers, venue: state.venue,
    pitch: state.pitch, weather: state.weather,
    teamA: state.teamA, teamB: state.teamB,
    tossWinner: state.tossWinner, tossDecision: state.tossDecision,
    strikerId: state.strikerId, nonStrikerId: state.nonStrikerId,
    bowlerId: state.bowlerId, previousBowlerId: state.previousBowlerId,
    innings: state.innings, currentInnings: state.currentInnings,
    freeHit: state.freeHit, matchComplete: state.matchComplete,
    matchPaused: state.matchPaused, pauseReason: state.pauseReason
  };
}

function pushStateToFirebase(){
  if(state.role !== 'admin') return;
  const payload = buildSyncPayload();
  if (state.matchCode) {
    saveMatchToLocal(state.matchCode, payload);
  }
  if(!syncRef) return;
  syncRef.set(payload).catch(err=>console.error('Firebase sync failed:', err));
}

function applyRemoteState(data){
  const normalized = normalizeMatchData(data);
  const preserve = {
    role: state.role, matchCode: state.matchCode, connected: state.connected,
    view: state.view, modal: null, history: state.history,
    step: state.step, tempRole: state.tempRole, tempCode: state.tempCode,
    showPauseMenu: state.showPauseMenu, legalModal: state.legalModal,
    chartMode: state.chartMode, selectedOverInspect: state.selectedOverInspect,
    soundEnabled: state.soundEnabled
  };
  Object.assign(state, normalized, preserve);
  render();
}

async function connectMatch(role, rawCode, password){
  const code = (rawCode || '').trim().toUpperCase();
  state.connectError = null;

  if (!code || code.length < 3) {
    state.connectError = 'Invalid Match Code: Please enter a valid 5-character match code provided by your scorer.';
    playTone('error');
    render();
    return;
  }

  state.connecting = true;
  render();

  /* Local preview / offline fallback when Firebase secrets are not injected */
  if (isLocalPreview || !db) {
    if (role === 'viewer') {
      const existingLocal = getMatchFromLocal(code);
      if (!existingLocal) {
        state.connecting = false;
        state.connectError = 'Invalid or unavailable Match Code "' + code + '". No active match was found for this code. Please verify the 5-character code with your scorer and try again.';
        playTone('error');
        render();
        return;
      }
      Object.assign(state, normalizeMatchData(existingLocal), {
        role: 'viewer',
        matchCode: code,
        connected: true,
        connecting: false,
        connectError: null,
        view: 'scorer',
        modal: null
      });
      showToast('Connected to match ' + code + ' as Viewer');
      render();
      return;
    }

    if (role === 'admin' && !password) {
      state.connecting = false;
      state.connectError = 'Please set a scorer password to protect this match before connecting.';
      playTone('error');
      render();
      return;
    }
    const enteredHash = password ? await hashPassword(password) : null;
    const existingLocal = getMatchFromLocal(code);
    if (existingLocal && existingLocal.scorer_password_hash && existingLocal.scorer_password_hash !== enteredHash) {
      state.connecting = false;
      state.connectError = 'Incorrect scorer password for existing match code "' + code + '".';
      playTone('error');
      render();
      return;
    }
    if (existingLocal && existingLocal.innings && existingLocal.innings.length > 0) {
      Object.assign(state, existingLocal);
      state.view = 'scorer';
    }
    state.scorerPasswordHash = enteredHash;
    state.role = role;
    state.matchCode = code;
    state.connected = true;
    state.connecting = false;
    saveMatchToLocal(code, buildSyncPayload());
    showToast('Connected to match ' + code + ' as Scorer');
    render();
    return;
  }

  firebase.auth().signInAnonymously().then(async ()=>{
    const ref = db.ref('matches/' + code);
    const snap = await ref.once('value');
    const existing = snap.val();

    if (role === 'viewer') {
      if (!existing) {
        state.connecting = false;
        state.connectError = 'Invalid or unavailable Match Code "' + code + '". No live match exists with this code. Please verify the 5-character code with your scorer and try again.';
        playTone('error');
        render();
        return;
      }
      state.role = 'viewer';
      state.matchCode = code;
      state.connected = true;
      state.connecting = false;
      state.view = 'scorer';
      syncRef = ref;
      applyRemoteState(existing);
      syncRef.on('value', s => {
        const data = s.val();
        if (data) applyRemoteState(data);
      }, err => console.error('Firebase read failed:', err));
      showToast('Connected to live match ' + code);
      return;
    }

    if(role === 'admin'){
      if(!password){
        state.connecting = false;
        state.connectError = 'Set a password to protect this match as its scorer.';
        playTone('error');
        render();
        return;
      }
      const enteredHash = await hashPassword(password);
      if(existing && existing.scorer_password_hash){
        if(enteredHash !== existing.scorer_password_hash){
          state.connecting = false;
          state.connectError = 'Incorrect scorer password for match code "' + code + '".';
          playTone('error');
          render();
          return;
        }
        Object.assign(state, normalizeMatchData(existing));
        if (state.innings && state.innings.length > 0) state.view = 'scorer';
      }
      state.scorerPasswordHash = enteredHash;
      state.role = 'admin';
      state.matchCode = code;
      state.connected = true;
      state.connecting = false;
      syncRef = ref;
      pushStateToFirebase();
      showToast('Connected as Scorer for match ' + code);
      render();
    }
  }).catch(err=>{
    state.connecting = false;
    console.error('Firebase auth failed:', err);
    state.connectError = 'Could not connect — make sure Anonymous sign-in is enabled in your Firebase console (Authentication → Sign-in method).';
    playTone('error');
    render();
  });
}

/* Listen for localStorage changes across tabs so Local Preview syncs live between Scorer & Viewer tabs! */
window.addEventListener('storage', e => {
  if (state.connected && state.role === 'viewer' && state.matchCode && e.key === 'scoreboard_match_' + state.matchCode) {
    try {
      const updated = JSON.parse(e.newValue);
      if (updated) applyRemoteState(updated);
    } catch (err) {}
  }
});

/* Keyboard shortcut: Escape or P opens/closes the Pause Menu when connected */
window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.key === 'Escape') {
    if (state.legalModal) { state.legalModal = null; render(); return; }
    if (state.showQrModal) { state.showQrModal = false; render(); return; }
    if (state.modal) { state.modal = null; render(); return; }
    state.showPauseMenu = !state.showPauseMenu;
    render();
  } else if ((e.key === 'p' || e.key === 'P') && state.connected && !state.modal) {
    state.showPauseMenu = !state.showPauseMenu;
    render();
  }
});

/* =========================================================
   ENGINE HELPERS
   ========================================================= */
function getMaxOversPerBowler(){
  switch(state.format){
    case 'T10': return 2;
    case 'T20': return 4;
    case 'ODI': return 10;
    case 'Test': return Infinity;
    default: return Math.max(1, Math.ceil(state.maxOvers/5));
  }
}

function freshInnings(battingTeam, bowlingTeam, target){
  return {
    battingTeam, bowlingTeam,
    deliveries: [],
    fow: [],
    target: target || null,
    battingOrderInPlay: [],
    outBatsmen: {},
    dismissedOrder: []
  };
}

function currentInnings(){ return state.innings[state.currentInnings]; }
function getTeam(teamKey){ return teamKey === 'A' ? state.teamA : state.teamB; }

function findPlayer(id){
  if(!id) return null;
  const pools = [state.teamA.players, state.teamA.substitutes, state.teamB.players, state.teamB.substitutes];
  for(const pool of pools){
    if(!pool) continue;
    const found = pool.find(p=>p.id===id);
    if(found) return found;
  }
  return null;
}

function displayPlayerName(id) {
  const p = findPlayer(id);
  if (!p) return id || '—';
  if (p.name && p.name.trim()) return p.name.trim();
  const teamKey = id.startsWith('A') ? 'A' : 'B';
  const num = id.replace(/^[AB]/, '');
  return (getTeam(teamKey).name || ('Team ' + teamKey)) + ' #' + num;
}

function legalBallCount(inn){
  return (inn && inn.deliveries) ? inn.deliveries.filter(d=>d.legal).length : 0;
}
function oversStr(inn){
  const legal = legalBallCount(inn);
  const overs = Math.floor(legal/6);
  const balls = legal%6;
  return overs+'.'+balls;
}
function teamTotal(inn){
  return (inn && inn.deliveries) ? inn.deliveries.reduce((s,d)=> s + d.runsOffBat + d.extraRuns, 0) : 0;
}
function teamWickets(inn){
  return (inn && inn.deliveries) ? inn.deliveries.filter(d=>d.wicket).length : 0;
}
function battingStatsFor(inn, playerId){
  let runs=0, balls=0, fours=0, sixes=0;
  (inn.deliveries || []).forEach(d=>{
    if(d.strikerId===playerId){
      if(d.extraType!=='Wd') balls++;
      runs += d.runsOffBat;
      if(d.runsOffBat===4) fours++;
      if(d.runsOffBat===6) sixes++;
    }
  });
  return {runs, balls, fours, sixes, sr: balls>0 ? ((runs/balls)*100).toFixed(1) : '0.0'};
}
function bowlingStatsFor(inn, playerId){
  const delivs = inn.deliveries || [];
  const balls = delivs.filter(d=>d.bowlerId===playerId && d.legal).length;
  const runs = delivs.filter(d=>d.bowlerId===playerId)
    .reduce((s,d)=> s + d.runsOffBat + (d.extraType==='Wd'||d.extraType==='Nb' ? d.extraRuns : 0), 0);
  const wkts = delivs.filter(d=>d.bowlerId===playerId && d.wicket && d.wicket.creditBowler).length;
  const overs = Math.floor(balls/6)+'.'+(balls%6);
  const econ = balls>0 ? (runs/(balls/6)).toFixed(2) : '0.00';
  let maidens=0;
  const overGroups = {};
  delivs.filter(d=>d.bowlerId===playerId).forEach(d=>{
    overGroups[d.overNum] = overGroups[d.overNum] || [];
    overGroups[d.overNum].push(d);
  });
  Object.values(overGroups).forEach(g=>{
    const legalInOver = g.filter(d=>d.legal).length;
    const runsInOver = g.reduce((s,d)=>s+d.runsOffBat+(d.extraType==='Wd'||d.extraType==='Nb'?d.extraRuns:0),0);
    if(legalInOver===6 && runsInOver===0) maidens++;
  });
  return {overs, runs, wkts, econ, maidens};
}

function pushHistory(){
  state.history.push(JSON.stringify({
    innings: state.innings,
    currentInnings: state.currentInnings,
    strikerId: state.strikerId,
    nonStrikerId: state.nonStrikerId,
    bowlerId: state.bowlerId,
    previousBowlerId: state.previousBowlerId,
    freeHit: state.freeHit,
    matchComplete: state.matchComplete
  }));
  if(state.history.length>60) state.history.shift();
}

function undo(){
  if(state.history.length===0) {
    showToast('Nothing left to undo', true);
    return;
  }
  const snap = JSON.parse(state.history.pop());
  state.innings = snap.innings;
  state.currentInnings = snap.currentInnings;
  state.strikerId = snap.strikerId;
  state.nonStrikerId = snap.nonStrikerId;
  state.bowlerId = snap.bowlerId;
  state.previousBowlerId = snap.previousBowlerId;
  state.freeHit = snap.freeHit;
  state.matchComplete = Boolean(snap.matchComplete);
  state.modal = null;
  playTone('tick');
  showToast('Last delivery undone');
  render();
}

function ensurePlayersReady() {
  if (state.matchPaused) {
    showToast('Match is currently paused (' + state.pauseReason + '). Resume from the Pause Menu to score.', true);
    return false;
  }
  if (!state.strikerId || !state.nonStrikerId) {
    state.modal = { type: 'newBatsman', outId: null };
    render();
    return false;
  }
  if (!state.bowlerId) {
    state.modal = { type: 'newBowler' };
    render();
    return false;
  }
  return true;
}

function recordDelivery(partial){
  const inn = currentInnings();
  const overNum = Math.floor(legalBallCount(inn)/6) + 1;
  const d = Object.assign({
    overNum,
    strikerId: state.strikerId,
    nonStrikerId: state.nonStrikerId,
    bowlerId: state.bowlerId,
    runsOffBat: 0,
    extraType: null,
    extraRuns: 0,
    legal: true,
    wicket: null,
    wasFreeHit: state.freeHit
  }, partial);
  inn.deliveries.push(d);
  return d;
}

function swapStrike(){
  const t = state.strikerId; state.strikerId = state.nonStrikerId; state.nonStrikerId = t;
}

function checkOverComplete(){
  const inn = currentInnings();
  const legal = legalBallCount(inn);
  if(legal>0 && legal%6===0){
    swapStrike();
    state.previousBowlerId = state.bowlerId;
    state.bowlerId = null;
  }
}

function bowlRuns(runs){
  if (!ensurePlayersReady()) return;
  pushHistory();
  recordDelivery({ runsOffBat: runs, legal:true });
  state.freeHit = false;
  if(runs%2===1) swapStrike();
  checkOverComplete();
  if (runs === 4 || runs === 6) playTone('boundary');
  else playTone('tick');
  if(state.bowlerId===null && !state.modal) state.modal = { type:'newBowler' };
  maybeEndInnings();
  render();
}

function bowlExtra(type){
  if (!ensurePlayersReady()) return;
  if(type==='Wd'){ openWideModal(); return; }
  if(type==='Nb'){ openNoBallModal(); return; }
  if(type==='B' || type==='Lb'){ openByeModal(type); return; }
}

function openWideModal(){ state.modal = { type:'wide' }; render(); }
function confirmWide(additionalRuns){
  pushHistory();
  recordDelivery({ extraType:'Wd', extraRuns: 1 + additionalRuns, runsOffBat:0, legal:false });
  if(additionalRuns%2===1) swapStrike();
  state.modal = null;
  playTone('tick');
  maybeEndInnings();
  render();
}

function openNoBallModal(){ state.modal = { type:'noball' }; render(); }
function confirmNoBall(runsOffBat){
  pushHistory();
  recordDelivery({ extraType:'Nb', extraRuns:1, runsOffBat, legal:false });
  state.freeHit = true;
  if(runsOffBat%2===1) swapStrike();
  state.modal = null;
  if (runsOffBat >= 4) playTone('boundary');
  else playTone('tick');
  maybeEndInnings();
  render();
}

function openByeModal(type){ state.modal = { type:'byes', extraType:type }; render(); }
function confirmByes(type, runs){
  pushHistory();
  recordDelivery({ extraType:type, extraRuns:runs, legal:true });
  state.freeHit = false;
  if(runs%2===1) swapStrike();
  checkOverComplete();
  state.modal = state.bowlerId===null ? { type:'newBowler' } : null;
  playTone('tick');
  maybeEndInnings();
  render();
}

function openWicketModal(){
  if (!ensurePlayersReady()) return;
  state.modal = { type:'wicket' };
  render();
}
function confirmWicket(dismissalType, fielderId, runOutInfo){
  pushHistory();
  const creditBowler = ['Bowled','Caught','LBW','Stumped','Hit Wicket'].includes(dismissalType);
  const isFreeHitProtected = state.freeHit && ['Bowled','Caught','LBW','Stumped','Hit Wicket'].includes(dismissalType) && dismissalType!=='Run Out';
  if(isFreeHitProtected){
    state.modal = null;
    showToast('Free Hit delivery — batter cannot be dismissed via ' + dismissalType + '!', true);
    render();
    return;
  }
  const inn = currentInnings();
  let dismissedId = state.strikerId;
  let runsCompleted = 0;
  let legal = true;
  let runsOffBat = 0;

  if(dismissalType==='Run Out'){
    dismissedId = runOutInfo.who || state.strikerId;
    runsCompleted = runOutInfo.runsCompleted || 0;
    runsOffBat = runsCompleted;
  }

  recordDelivery({
    runsOffBat, legal,
    wicket: { dismissedId, dismissalType, fielderId: fielderId||null, creditBowler }
  });
  state.freeHit = false;
  inn.fow.push({
    wicketNum: teamWickets(inn),
    score: teamTotal(inn),
    player: displayPlayerName(dismissedId),
    over: oversStr(inn)
  });
  inn.dismissedOrder.push(dismissedId);

  if(dismissalType==='Run Out' && runsCompleted%2===1) swapStrike();

  if(dismissedId===state.strikerId){
    state.strikerId = null;
  } else {
    state.nonStrikerId = null;
  }
  playTone('wicket');
  checkOverComplete();
  const ended = maybeEndInnings();
  if (!ended) {
    state.modal = { type:'newBatsman', outId: dismissedId };
  }
  render();
}

function confirmNewBatsman(playerId){
  if (!playerId) return;
  if(state.strikerId===null) state.strikerId = playerId;
  else if(state.nonStrikerId===null) state.nonStrikerId = playerId;

  if (state.strikerId === null || state.nonStrikerId === null) {
    state.modal = { type: 'newBatsman', outId: null, openers: true };
  } else if (state.bowlerId === null) {
    state.modal = { type: 'newBowler' };
  } else {
    state.modal = null;
  }
  render();
}

function confirmNewBowler(playerId){
  if (!playerId) return;
  state.bowlerId = playerId;
  state.modal = (state.strikerId===null || state.nonStrikerId===null) ? {type:'newBatsman', outId:null} : null;
  render();
}

function maybeEndInnings(){
  const inn = currentInnings();
  if (!inn) return false;
  const wkts = teamWickets(inn);
  const overs = legalBallCount(inn)/6;
  const total = teamTotal(inn);
  const allOut = wkts>=10;
  const oversDone = overs>=state.maxOvers;
  const chased = inn.target!==null && total>=inn.target;
  if(allOut || oversDone || chased){
    if(state.currentInnings===0){
      const bat2 = inn.bowlingTeam, bowl2 = inn.battingTeam;
      state.innings.push(freshInnings(bat2, bowl2, teamTotal(inn)+1));
      state.currentInnings = 1;
      state.strikerId=null; state.nonStrikerId=null; state.bowlerId=null; state.previousBowlerId=null; state.freeHit=false;
      state.modal = {type:'newBatsman', outId:null, openers:true};
      showToast('Innings 1 complete! Target set: ' + (teamTotal(inn) + 1));
      return true;
    } else {
      state.view = 'viewer';
      state.modal = null;
      state.matchComplete = true;
      showToast('Match complete! Final scorecard ready.');
      return true;
    }
  }
  return false;
}

function forceEndCurrentInnings() {
  const inn = currentInnings();
  if (!inn) return;
  pushHistory();
  if (state.currentInnings === 0) {
    const bat2 = inn.bowlingTeam, bowl2 = inn.battingTeam;
    state.innings.push(freshInnings(bat2, bowl2, teamTotal(inn) + 1));
    state.currentInnings = 1;
    state.strikerId = null; state.nonStrikerId = null; state.bowlerId = null; state.previousBowlerId = null; state.freeHit = false;
    state.showPauseMenu = false;
    state.modal = { type: 'newBatsman', outId: null, openers: true };
    showToast('Innings 1 declared/closed. Target: ' + (teamTotal(inn) + 1));
  } else {
    state.matchComplete = true;
    state.showPauseMenu = false;
    state.modal = null;
    state.view = 'viewer';
    showToast('Match concluded! Viewing final scorecard.');
  }
  render();
}

function handleLogoClick() {
  if (!state.connected) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (state.innings.length > 0) {
    state.view = state.view === 'scorer' ? 'viewer' : 'scorer';
    showToast('Switched to ' + (state.view === 'scorer' ? 'Live Scorer' : 'Scoreboard'));
    render();
  } else {
    state.view = 'setup';
    render();
  }
}

function disconnectToHome() {
  if (syncRef && state.role === 'viewer') {
    try { syncRef.off(); } catch (e) {}
  }
  syncRef = null;
  state.connected = false;
  state.connecting = false;
  state.connectError = null;
  state.showPauseMenu = false;
  state.modal = null;
  render();
}

function openPauseMenu() {
  state.showPauseMenu = true;
  render();
}

function openLegalModal(kind) {
  state.legalModal = kind;
  render();
}

function updateDynamicTitle() {
  if (!state.connected) {
    document.title = 'Scoreboard — Live Cricket Broadcast & Scorer';
    return;
  }
  if (state.innings.length > 0) {
    const inn = currentInnings() || state.innings[state.innings.length - 1];
    const bat = getTeam(inn.battingTeam).name || 'Team';
    const bowl = getTeam(inn.bowlingTeam).name || 'Team';
    const scoreText = teamTotal(inn) + '/' + teamWickets(inn) + ' (' + oversStr(inn) + ')';
    if (state.matchComplete) {
      document.title = 'Final: ' + bat + ' vs ' + bowl + ' — Scoreboard';
    } else if (state.matchPaused) {
      document.title = '[PAUSED] ' + bat + ' ' + scoreText + ' vs ' + bowl + ' — Scoreboard';
    } else {
      document.title = bat + ' ' + scoreText + ' vs ' + bowl + ' · Live — Scoreboard';
    }
  } else {
    document.title = 'Match Setup (' + (state.matchCode || '') + ') — Scoreboard';
  }
}

/* =========================================================
   RENDER PIPELINE
   ========================================================= */
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

function render(){
  updateDynamicTitle();
  const app = document.getElementById('app');
  app.innerHTML = '';

  if(!state.connected){
    app.appendChild(renderConnectTopbar());
    app.appendChild(renderConnectGate());
    if (state.showPauseMenu) app.appendChild(renderPauseModal());
    if (state.legalModal) app.appendChild(renderLegalModal());
    attachQRCodes();
    return;
  }

  pushStateToFirebase();
  app.appendChild(renderTopline());

  if (state.matchPaused) {
    app.appendChild(renderPausedBanner());
  }

  if(state.role==='viewer' && state.innings.length===0){
    app.appendChild(renderWaiting());
  } else {
    if(state.view==='setup') app.appendChild(renderSetup());
    if(state.view==='scorer') app.appendChild(renderScorer());
    if(state.view==='viewer') app.appendChild(renderViewer());
  }

  if(state.modal) app.appendChild(renderModal());
  if(state.showQrModal) app.appendChild(renderQrModal());
  if(state.showPauseMenu) app.appendChild(renderPauseModal());
  if(state.legalModal) app.appendChild(renderLegalModal());
  attachQRCodes();
}

function renderConnectGate(){

  wrap.appendChild(el('div','step-label', isLocalPreview ? '● LIVE CONSOLE · READY' : '● CLOUD SYNC · READY'));

  wrap.appendChild(fieldChoice('I am the...', ['Scorer (Admin)','Viewer'],

        state.tempCode = state.adminDraftCode;

        state.tempCode = '';
      }
      render();
    }));

  const codeField = el('div','field');

    ? 'Match code — share this with your viewers'

    qrBox.style.display = 'inline-block';
    qrBox.style.padding = '8px';
    qrBox.style.borderRadius = '12px';

    const qrInfo = el('div', 'helptext',
      'Spectators can scan this QR code or type <strong class="num" style="color:#34d399;">' + (state.tempCode || '—') + '</strong> in Viewer mode to watch every ball update live.');

    qrField.appendChild(qrRow);
    wrap.appendChild(qrField);
  }

  wrap.appendChild(el('div','helptext', state.tempRole==='admin'
    ? 'Only the scorer needs the password. Viewers join with just the 5-character match code.'

      '<div><strong style="color:#fda4af;display:block;margin-bottom:2px;">Match Connection Error</strong>' +
      '<span>' + state.connectError + '</span></div>';

/* ---------------- SETUP WIZARD ---------------- */
function renderSetup(){
  const wrap = el('div','clipboard');
  const step = state.step;
  wrap.appendChild(el('div','step-label','STEP '+step+' OF 4'));

  if(step===1){
    wrap.appendChild(el('h2','Match details & conditions'));
    wrap.appendChild(fieldChoice('Format', ['T10','T20','ODI','Test','Custom'], state.format, v=>{
      state.format=v;
      state.maxOvers = v==='T10'?10:v==='T20'?20:v==='ODI'?50:v==='Test'?90:state.maxOvers;
      render();
    }));
    if(state.format==='Custom'){
      wrap.appendChild(fieldInputNumber('Max overs per innings', state.maxOvers, v=>{ state.maxOvers=Math.max(1, v); }));
    }
    const row = el('div','row2');
    row.appendChild(fieldTextInline('Venue / Ground', state.venue, v=>state.venue=v, 'e.g. Oval Ground, Pitch 2'));
    row.appendChild(fieldSelectInline('Pitch condition', ['Dry','Green','Dusty','Damp'], state.pitch, v=>state.pitch=v));
    wrap.appendChild(row);
    wrap.appendChild(fieldSelectInline('Weather', ['Clear','Overcast','Humid','Rain interruption'], state.weather, v=>state.weather=v));
  }

  if(step===2){
    wrap.appendChild(el('h2','Team registration'));

    ['A','B'].forEach(key=>{
      const team = getTeam(key);
      wrap.appendChild(fieldTextInline('Team '+key+' name', team.name, v=>team.name=v, 'Team ' + key));

      if(state.savedRosters===null){
        state.savedRosters = 'loading';
        loadSavedRosters();
      }
      const rosterRow = el('div','row2');
      const loadField = el('div','field');
      loadField.appendChild(el('label','','Load a saved roster'));
      if(state.savedRosters==='loading'){
        loadField.appendChild(el('div','helptext','Loading your saved rosters…'));
      } else {
        const rosterSel = el('select');
        const blank = el('option','','— Select saved squad —'); blank.value=''; rosterSel.appendChild(blank);
        (state.savedRosters||[]).forEach(r=>{
          const opt = el('option','', r.name+' ('+new Date(r.savedAt).toLocaleDateString()+')');
          opt.value = r.id;
          rosterSel.appendChild(opt);
        });
        rosterSel.onchange = e=>{ if(e.target.value) applyRoster(key, e.target.value); };
        loadField.appendChild(rosterSel);
      }
      rosterRow.appendChild(loadField);

      const saveField = el('div','field');
      saveField.appendChild(el('label','','Save this team as a roster'));
      const saveNameInput = el('input');
      saveNameInput.type='text'; saveNameInput.placeholder='Roster name';
      saveNameInput.value = state.tempRosterSaveName[key] || team.name;
      saveNameInput.oninput = e=>{ state.tempRosterSaveName[key] = e.target.value; };
      saveField.appendChild(saveNameInput);
      const saveBtn = el('button','btn btn-ghost','Save Roster');
      saveBtn.type='button'; saveBtn.style.marginTop='8px'; saveBtn.style.padding='8px 14px'; saveBtn.style.fontSize='12px';
      saveBtn.onclick = ()=>{ saveRoster(key, state.tempRosterSaveName[key] || team.name); };
      saveField.appendChild(saveBtn);
      rosterRow.appendChild(saveField);
      wrap.appendChild(rosterRow);

      wrap.appendChild(el('div','team-list-title','Playing XI — '+(team.name || ('Team '+key))));
      wrap.appendChild(el('div','helptext','Leave blank to use default player numbers, or enter names below.'));
      team.players.forEach((p,i)=>{
        const row = el('div','player-row');
        const nameInput = el('input'); nameInput.type='text'; nameInput.placeholder='Player '+(i+1)+' name';
        nameInput.value = p.name; nameInput.oninput = e=>{p.name=e.target.value;};
        const batSel = el('select');
        ['RHB','LHB'].forEach(o=>{ const opt=el('option','',o); opt.value=o; if(o===p.battingStyle) opt.selected=true; batSel.appendChild(opt); });
        batSel.onchange = e=>p.battingStyle=e.target.value;
        const bowlSel = el('select');
        BOWLING_ROLES.forEach(o=>{ const opt=el('option','',o); opt.value=o; if(o===p.bowlingRole) opt.selected=true; bowlSel.appendChild(opt); });
        bowlSel.onchange = e=>p.bowlingRole=e.target.value;
        row.appendChild(nameInput); row.appendChild(batSel); row.appendChild(bowlSel);
        wrap.appendChild(row);
      });

      wrap.appendChild(el('div','team-list-title','Substitutes — '+(team.name || ('Team '+key))+' (up to 2)'));
      team.substitutes.forEach((p,i)=>{
        const row = el('div','player-row');
        const nameInput = el('input'); nameInput.type='text'; nameInput.placeholder='Substitute '+(i+1)+' name';
        nameInput.value = p.name; nameInput.oninput = e=>{p.name=e.target.value;};
        const batSel = el('select');
        ['RHB','LHB'].forEach(o=>{ const opt=el('option','',o); opt.value=o; if(o===p.battingStyle) opt.selected=true; batSel.appendChild(opt); });
        batSel.onchange = e=>p.battingStyle=e.target.value;
        const bowlSel = el('select');
        BOWLING_ROLES.forEach(o=>{ const opt=el('option','',o); opt.value=o; if(o===p.bowlingRole) opt.selected=true; bowlSel.appendChild(opt); });
        bowlSel.onchange = e=>p.bowlingRole=e.target.value;
        row.appendChild(nameInput); row.appendChild(batSel); row.appendChild(bowlSel);
        wrap.appendChild(row);
      });
    });
  }

  if(step===3){
    const nameA = state.teamA.name || 'Team A';
    const nameB = state.teamB.name || 'Team B';
    if (!state.tossWinner) state.tossWinner = nameA;
    if (!state.tossDecision) state.tossDecision = 'Bat';
    wrap.appendChild(el('h2','The toss'));
    wrap.appendChild(fieldChoice('Who won the toss?', [nameA, nameB], state.tossWinner, v=>{state.tossWinner=v; render();}));
    wrap.appendChild(fieldChoice('Elected to', ['Bat','Bowl'], state.tossDecision, v=>{state.tossDecision=v; render();}));
  }

  if(step===4){
    wrap.appendChild(el('h2','Opening players'));
    const battingFirst = decideBattingTeam();
    const bowlingFirst = battingFirst===state.teamA ? state.teamB : state.teamA;
    if (!state.strikerId && battingFirst.players[0]) state.strikerId = battingFirst.players[0].id;
    if (!state.nonStrikerId && battingFirst.players[1]) state.nonStrikerId = battingFirst.players[1].id;
    if (!state.bowlerId && bowlingFirst.players[0]) state.bowlerId = bowlingFirst.players[0].id;

    wrap.appendChild(el('div','helptext', (battingFirst.name||'Batting team') + ' bats first · ' + (bowlingFirst.name||'Bowling team') + ' bowls first.'));
    wrap.appendChild(playerSelectField('Striker (faces first ball)', battingFirst.players, state.strikerId, v=>{
      state.strikerId = v;
      if (state.nonStrikerId === v) {
        const alt = battingFirst.players.find(p => p.id !== v);
        state.nonStrikerId = alt ? alt.id : null;
      }
      render();
    }));
    wrap.appendChild(playerSelectField('Non-striker', battingFirst.players.filter(p=>p.id!==state.strikerId), state.nonStrikerId, v=>{ state.nonStrikerId=v; render(); }));
    wrap.appendChild(playerSelectField('Opening bowler', bowlingFirst.players, state.bowlerId, v=>{ state.bowlerId=v; render(); }));
  }

  const actions = el('div','wizard-actions');
  const back = el('button','btn btn-ghost','← Back');
  back.type = 'button';
  back.disabled = step===1;
  back.onclick = ()=>{ state.step=Math.max(1,step-1); render(); };

  const rightBtns = el('div', '');
  rightBtns.style.display = 'flex';
  rightBtns.style.gap = '8px';

  if (state.innings.length > 0) {
    const returnBtn = el('button', 'btn btn-ghost', 'Return to Match');
    returnBtn.type = 'button';
    returnBtn.onclick = () => { state.view = 'scorer'; render(); };
    rightBtns.appendChild(returnBtn);
  }

  const next = el('button','btn btn-primary', step<4 ? 'Continue →' : (state.innings.length > 0 ? 'Save & Return' : 'Start Match 🏏'));
  next.type = 'button';
  next.onclick = ()=>{
    if(step<4){ state.step++; render(); }
    else startMatch();
  };
  rightBtns.appendChild(next);

  actions.appendChild(back);
  actions.appendChild(rightBtns);
  wrap.appendChild(actions);
  return wrap;
}

function decideBattingTeam(){
  if(!state.tossWinner) return state.teamA;
  const winnerTeam = state.tossWinner===(state.teamA.name||'Team A') ? state.teamA : state.teamB;
  const otherTeam = winnerTeam===state.teamA ? state.teamB : state.teamA;
  if(state.tossDecision==='Bat') return winnerTeam;
  if(state.tossDecision==='Bowl') return otherTeam;
  return state.teamA;
}

function startMatch(){
  if (state.innings.length > 0) {
    state.view = 'scorer';
    showToast('Match settings updated');
    render();
    return;
  }
  const battingFirst = decideBattingTeam();
  const bowlingFirst = battingFirst===state.teamA ? state.teamB : state.teamA;
  if (!state.strikerId) state.strikerId = battingFirst.players[0].id;
  if (!state.nonStrikerId || state.nonStrikerId === state.strikerId) state.nonStrikerId = battingFirst.players[1].id;
  if (!state.bowlerId) state.bowlerId = bowlingFirst.players[0].id;

  state.innings = [ freshInnings(battingFirst===state.teamA?'A':'B', bowlingFirst===state.teamA?'A':'B', null) ];
  state.currentInnings = 0;
  state.view = 'scorer';
  showToast('Play started! ' + (battingFirst.name || 'Team A') + ' batting first.');
  render();
}

function playerSelectField(label, players, value, onChange){

  });
  s.onchange = e=>{ onChange(e.target.value); };
  f.appendChild(s);
  return f;

/* ---------------- LIVE SCORER ---------------- */
function currentPartnership(inn) {
  let runs = 0, balls = 0;
  for (let i = inn.deliveries.length - 1; i >= 0; i--) {
    const d = inn.deliveries[i];
    if (d.wicket) break;
    runs += d.runsOffBat + d.extraRuns;
    if (d.legal) balls++;
  }
  return { runs, balls };
}

function renderScorer(){
  const inn = currentInnings();
  if (!inn) return renderWaiting();
  const frag = el('div');
  const battingTeam = getTeam(inn.battingTeam);
  const bowlingTeam = getTeam(inn.bowlingTeam);

  const board = el('div','board');
  const top = el('div','board-top');
  const left = el('div');
  left.appendChild(el('div','board-teams',
    '<span>' + battingTeam.name + ' vs ' + bowlingTeam.name + '</span>' +
    '<span style="color:#64748b;">·</span>' +
    '<span style="color:#38bdf8;">Innings ' + (state.currentInnings+1) + ' (' + state.format + ')</span>'
  ));
  left.appendChild(el('div','board-score num', teamTotal(inn)+' / '+teamWickets(inn)));
  const legalBalls = legalBallCount(inn);
  const crr = legalBalls>0 ? (teamTotal(inn)/(legalBalls/6)).toFixed(2) : '0.00';
  const part = currentPartnership(inn);
  left.appendChild(el('div','board-sub',
    oversStr(inn)+' overs · CRR '+crr +
    ' · Partnership '+part.runs+' ('+part.balls+')' +
    (inn.target ? ' · Target '+inn.target : '')
  ));
  top.appendChild(left);

  const oStat = el('div','board-stat');
  oStat.appendChild(el('div','label','Overs / Quota'));
  oStat.appendChild(el('div','value num', oversStr(inn)+' / '+state.maxOvers));
  const projected = legalBalls >= 6 ? Math.round((teamTotal(inn) / (legalBalls / 6)) * state.maxOvers) : null;
  if (projected && !inn.target) {
    oStat.appendChild(el('div','label','Proj: ~'+projected));
  }
  top.appendChild(oStat);

  const rStat = el('div','board-stat');
  if(inn.target){
    const remaining = inn.target - teamTotal(inn);
    const ballsLeft = Math.max(0, state.maxOvers*6 - legalBalls);
    const rrr = ballsLeft>0 ? (Math.max(0, remaining)/(ballsLeft/6)).toFixed(2) : '—';
    rStat.appendChild(el('div','label','Equation'));
    rStat.appendChild(el('div','value num', Math.max(remaining,0)+' off '+ballsLeft+'b'));
    rStat.appendChild(el('div','label','RRR '+rrr));
  } else {
    rStat.appendChild(el('div','label','Venue & Pitch'));
    rStat.appendChild(el('div','value', '<span style="font-size:14px;">'+(state.venue || 'Main Ground')+'</span>'));
    rStat.appendChild(el('div','label', state.pitch+' · '+state.weather));
  }
  top.appendChild(rStat);
  board.appendChild(top);

  if(state.freeHit) board.appendChild(el('div','freehit-banner','⚡ FREE HIT — Next Legal Delivery (No Bowler/Fielder Wickets Except Run Out)'));

  const mid = el('div','board-mid');
  const strikePanel = el('div','player-panel');
  const batHeader = el('div','panel-title');
  batHeader.innerHTML = '<span>BATTING CREASE</span>';
  if (state.role === 'admin') {
    const swapBtn = el('button', 'footer-link-btn', '⇄ Swap Ends');
    swapBtn.type = 'button';
    swapBtn.style.color = '#34d399';
    swapBtn.style.fontWeight = '700';
    swapBtn.onclick = () => {
      swapStrike();
      showToast('Strike rotated manually');
      render();
    };
    batHeader.appendChild(swapBtn);
  }
  strikePanel.appendChild(batHeader);

  [state.strikerId, state.nonStrikerId].forEach(pid=>{
    if(!pid) return;
    const st = battingStatsFor(inn, pid);
    const line = el('div','p-line');
    line.appendChild(el('span','name'+(pid===state.strikerId?' strike':''), displayPlayerName(pid)));
    line.appendChild(el('span','figs num', st.runs+' ('+st.balls+') · 4s:'+st.fours+' 6s:'+st.sixes+' · SR '+st.sr));
    strikePanel.appendChild(line);
  });
  mid.appendChild(strikePanel);

  const bowlPanel = el('div','player-panel');
  const bowlHeader = el('div','panel-title');
  bowlHeader.innerHTML = '<span>CURRENT BOWLER &amp; OVER</span>';
  if (state.role === 'admin') {
    const chgBtn = el('button', 'footer-link-btn', 'Change Bowler');
    chgBtn.type = 'button';
    chgBtn.style.color = '#38bdf8';
    chgBtn.style.fontWeight = '700';
    chgBtn.onclick = () => { state.modal = { type: 'newBowler' }; render(); };
    bowlHeader.appendChild(chgBtn);
  }
  bowlPanel.appendChild(bowlHeader);

  if(state.bowlerId){
    const bs = bowlingStatsFor(inn, state.bowlerId);
    const maxOv = getMaxOversPerBowler();
    const line = el('div','p-line');
    line.appendChild(el('span','name', displayPlayerName(state.bowlerId)));
    line.appendChild(el('span','figs num', bs.overs+'-'+bs.maidens+'-'+bs.runs+'-'+bs.wkts+' · Econ '+bs.econ));
    bowlPanel.appendChild(line);
    if(isFinite(maxOv)){
      bowlPanel.appendChild(el('div','p-line', '<span style="font-size:11px;color:#94a3b8;">Quota: '+bs.overs+' / '+maxOv+' overs max</span>'));
    }
  }
  const currentOverNum = Math.floor(legalBalls/6)+1;
  const thisOverBalls = inn.deliveries.filter(d=> d.overNum===currentOverNum );
  const timeline = el('div','over-timeline');
  if (thisOverBalls.length === 0) {
    timeline.appendChild(el('span', 'empty-note', 'New over (' + currentOverNum + ') ready…'));
  } else {
    thisOverBalls.forEach(d=>{
      let label, cls='ball-pill';
      if(d.extraType==='Wd'){
        const additional = d.extraRuns - 1;
        label = 'Wd' + (additional>0 ? '+'+additional : '');
        cls+=' x';
      } else if(d.extraType==='Nb'){
        label = 'Nb' + (d.runsOffBat>0 ? '+'+d.runsOffBat : '');
        cls+=' x';
      } else if(d.extraType==='B' || d.extraType==='Lb'){
        label = d.extraType + d.extraRuns;
        cls+=' x';
      } else {
        label = d.runsOffBat.toString();
        if (d.runsOffBat === 4) cls += ' b4';
        if (d.runsOffBat === 6) cls += ' b6';
      }
      if(d.wicket){ label='W'; cls='ball-pill w'; }
      timeline.appendChild(el('div',cls,label));
    });
  }
  bowlPanel.appendChild(timeline);
  mid.appendChild(bowlPanel);
  board.appendChild(mid);
  frag.appendChild(board);

  if(state.role!=='admin'){
    const viewerHint = el('div', 'paper');
    viewerHint.style.display = 'flex';
    viewerHint.style.flexWrap = 'wrap';
    viewerHint.style.justifyContent = 'space-between';
    viewerHint.style.alignItems = 'center';
    viewerHint.style.gap = '12px';
    viewerHint.innerHTML = '<div><strong style="color:#ffffff;">Live Viewer Mode</strong><div style="font-size:12.5px;color:#94a3b8;margin-top:2px;">Want to inspect Worm/Manhattan graphs and full batting &amp; bowling cards?</div></div>';
    const goCardBtn = el('button', 'btn btn-primary', 'Open Full Scoreboard & Graphs →');
    goCardBtn.type = 'button';
    goCardBtn.onclick = () => { state.view = 'viewer'; render(); };
    viewerHint.appendChild(goCardBtn);
    frag.appendChild(viewerHint);
    return frag;
  }

  const controls = el('div','controls');
  const topCtrl = el('div','ctrl-toprow');
  topCtrl.appendChild(el('div','serif','Ball-by-Ball Scoring Console'));
  const ctrlRight = el('div', '');
  ctrlRight.style.display = 'flex';
  ctrlRight.style.gap = '8px';
  ctrlRight.style.alignItems = 'center';

  const pauseQuick = el('button', 'chip undo', state.matchPaused ? '▶ Resume' : '⏸ Pause');
  pauseQuick.type = 'button';
  pauseQuick.onclick = () => {
    state.matchPaused = !state.matchPaused;
    showToast(state.matchPaused ? 'Match Paused' : 'Match Resumed');
    render();
  };
  ctrlRight.appendChild(pauseQuick);

  const undoBtn = el('button','chip undo','↶ Undo Last Ball');
  undoBtn.type = 'button';
  undoBtn.disabled = state.history.length === 0;
  undoBtn.onclick = undo;
  ctrlRight.appendChild(undoBtn);
  topCtrl.appendChild(ctrlRight);
  controls.appendChild(topCtrl);

  const runsSec = el('div','ctrl-section');
  runsSec.appendChild(el('div','ctrl-label','RUNS OFF BAT'));
  const runsRow = el('div','chip-row');
  [0,1,2,3,4,6].forEach(r=>{

function exportMatchJson() {
  try {
    const dataStr = JSON.stringify(buildSyncPayload(), null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'scoreboard-match-' + (state.matchCode || 'backup') + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast('Match JSON exported!');
  } catch (e) {
    showToast('Export failed', true);
  }
}
