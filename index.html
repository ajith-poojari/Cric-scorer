<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard — Live Cricket Scorer</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
  /* Pre-compiled Tailwind Dashboard Theme — renders immediately without CDN compilation */
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background-color: #020617; /* slate-950 */
    color: #f1f5f9; /* slate-100 */
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.45; pointer-events: none; }
  input, select { font-family: inherit; }

  .num { font-family: 'Space Mono', monospace; font-variant-numeric: tabular-nums; }
  .serif { font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.02em; }

  /* ---------- App Shell ---------- */
  .app { max-width: 1024px; margin: 0 auto; padding: 24px 16px 80px; }
  .topline {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 24px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
  }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff; }
  .brand span { color: #34d399; }
  .subnav {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #020617;
    padding: 6px;
    border-radius: 12px;
    border: 1px solid #1e293b;
    font-size: 13px;
    font-weight: 500;
    color: #94a3b8;
  }
  .subnav span { padding: 6px 12px; border-radius: 8px; transition: color 0.15s; }
  .subnav span:hover { color: #e2e8f0; }
  .subnav b {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(16, 185, 129, 0.3);
    margin: -6px -12px;
    display: inline-block;
  }

  /* ---------- Setup Wizard & Connect Card ---------- */
  .clipboard {
    background: #0f172a;
    color: #f1f5f9;
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 672px;
    margin: 0 auto;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
  }
  .step-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #34d399;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.25);
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .clipboard h2 {
    margin: 0 0 24px;
    padding-bottom: 12px;
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
    border-bottom: 1px solid #1e293b;
  }
  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #94a3b8;
    margin-bottom: 8px;
  }
  .field input[type=text],
  .field input[type=number],
  .field input[type=password],
  .field select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #020617;

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .choice-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .choice {
    border: 1px solid #334155;
    background: #020617;
    color: #cbd5e1;
    padding: 10px 16px;

  .player-row {

    font-size: 13px;

    border: 1px solid #334155;

    font-size: 14px;
    font-weight: 600;

  .btn-primary {

  .board-stat .label {

  .player-panel { padding: 20px 24px; border-right: 1px solid #1e293b; }

  .panel-title {
    font-size: 11px;

  /* ---------- Controls Keypad ---------- */

    border-bottom: 1px solid #1e293b;

  .ctrl-section { margin-bottom: 18px; }
  .ctrl-section:last-child { margin-bottom: 0; }
  .ctrl-label {
    font-size: 11px;

  /* ---------- Modals ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.82);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;

  .modal {
    background: #0f172a;
    color: #f1f5f9;

    padding: 24px;

  .modal h3 { margin: 0 0 12px; font-size: 18px; font-weight: 700; color: #ffffff; }
  .modal select, .modal input {

    border-radius: 12px;

  .fow-row {

  .empty-note { font-size: 13.5px; color: #94a3b8; font-style: italic; }
  .innings-tag {
    display: inline-block;

    border: 1px solid rgba(16, 185, 129, 0.3);

  .app-footer {
    max-width: 1024px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    font-size: 12px;

<div class="app" id="app"></div>
<footer class="app-footer">
  <span>&copy; 2026 Scoreboard</span>
  <div>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms and Conditions</a>
  </div>

<script>

const firebaseConfig = {
  apiKey: "__FIREBASE_API_KEY__",
  authDomain: "__FIREBASE_AUTH_DOMAIN__",
  databaseURL: "__FIREBASE_DATABASE_URL__",
  projectId: "__FIREBASE_PROJECT_ID__",
  storageBucket: "__FIREBASE_STORAGE_BUCKET__",
  messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
  appId: "__FIREBASE_APP_ID__",
  measurementId: "__FIREBASE_MEASUREMENT_ID__"
};

/* Prevent fatal crash on localhost before GitHub Actions injects secrets */
const isLocalPreview = firebaseConfig.databaseURL.startsWith('__FIREBASE_');
let db = null;
let syncRef = null;

if (!isLocalPreview && typeof firebase !== 'undefined') {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (err) {
    console.warn('Firebase initialization skipped or failed:', err);
  }
}

function buildJoinUrl(code){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('code', code);
  return url.toString();
}
function attachQRCodes(){
  document.querySelectorAll('[data-qr]').forEach(elNode=>{
    const text = elNode.getAttribute('data-qr');
    const size = parseInt(elNode.getAttribute('data-qr-size') || '140');
    elNode.innerHTML = '';
    if(window.QRCode){
      new QRCode(elNode, { text, width: size, height: size, colorDark:'#0f172a', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
    }
  });
}

async function loadSavedRosters(){
  if(!db || !firebase.auth().currentUser){ state.savedRosters = []; render(); return; }
  try{
    const uid = firebase.auth().currentUser.uid;
    const snap = await db.ref('rosters/'+uid).once('value');
    const data = snap.val() || {};
    state.savedRosters = Object.keys(data).map(id=>Object.assign({id}, data[id]));
    render();
  }catch(e){
    console.error('Failed to load saved rosters:', e);
    state.savedRosters = [];
    render();
  }
}
async function saveRoster(teamKey, name){
  const team = getTeam(teamKey);
  if(!db || !firebase.auth().currentUser) return;
  const uid = firebase.auth().currentUser.uid;
  const payload = {
    name: name || team.name || 'Unnamed roster',
    players: team.players, substitutes: team.substitutes,
    savedAt: Date.now()
  };
  const ref = db.ref('rosters/'+uid).push();
  await ref.set(payload);
  state.savedRosters = null;
  render();
}
function applyRoster(teamKey, rosterId){
  const roster = (state.savedRosters||[]).find(r=>r.id===rosterId);
  if(!roster) return;
  const team = getTeam(teamKey);
  team.name = roster.name;
  team.players = JSON.parse(JSON.stringify(roster.players));
  team.substitutes = JSON.parse(JSON.stringify(roster.substitutes));
  render();
}

function generateMatchCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function hashPassword(pw){
  if (window.crypto && window.crypto.subtle) {
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  return btoa(pw);
}

/* Fields that are the shared "match record" — everything a viewer needs. */
function buildSyncPayload(){
  return {
    admin_uid: (!isLocalPreview && firebase.auth().currentUser) ? firebase.auth().currentUser.uid : 'local-admin',
    scorer_password_hash: state.scorerPasswordHash || null,
    format: state.format, maxOvers: state.maxOvers, venue: state.venue,
    pitch: state.pitch, weather: state.weather,
    teamA: state.teamA, teamB: state.teamB,
    tossWinner: state.tossWinner, tossDecision: state.tossDecision,
    strikerId: state.strikerId, nonStrikerId: state.nonStrikerId,
    bowlerId: state.bowlerId, previousBowlerId: state.previousBowlerId,
    innings: state.innings, currentInnings: state.currentInnings,
    freeHit: state.freeHit, matchComplete: state.matchComplete
  };
}
function pushStateToFirebase(){
  if(state.role!=='admin' || !syncRef) return;
  syncRef.set(buildSyncPayload()).catch(err=>console.error('Firebase sync failed:', err));
}
function applyRemoteState(data){
  const preserve = {
    role: state.role, matchCode: state.matchCode, connected: state.connected,
    view: state.view, modal: null, history: state.history,
    step: state.step, tempRole: state.tempRole, tempCode: state.tempCode
  };
  Object.assign(state, data, preserve);
  render();
}
async function connectMatch(role, code, password){
  state.connecting = true;
  state.connectError = null;
  render();

  /* Localhost preview fallback when Firebase secrets are not injected yet */
  if (isLocalPreview || !db) {
    if (role === 'admin' && !password) {
      state.connecting = false;
      state.connectError = 'Set a password to protect this match as its scorer.';
      render();
      return;
    }
    state.scorerPasswordHash = password ? await hashPassword(password) : null;
    state.role = role;
    state.matchCode = code;
    state.connected = true;
    state.connecting = false;
    if (role === 'viewer') state.view = 'scorer';
    render();
    return;
  }

  firebase.auth().signInAnonymously().then(async ()=>{
    const ref = db.ref('matches/' + code);

    if(role==='admin'){
      if(!password){
        state.connecting = false;
        state.connectError = 'Set a password to protect this match as its scorer.';
        render();
        return;
      }
      const snap = await ref.once('value');
      const existing = snap.val();
      const enteredHash = await hashPassword(password);
      if(existing && existing.scorer_password_hash){
        if(enteredHash !== existing.scorer_password_hash){
          state.connecting = false;
          state.connectError = 'Incorrect scorer password for this match code.';
          render();
          return;
        }
      }
      state.scorerPasswordHash = enteredHash;
    }

    state.role = role;
    state.matchCode = code;
    state.connected = true;
    state.connecting = false;
    syncRef = ref;
    if(role==='viewer'){
      state.view = 'scorer';
      syncRef.on('value', snap=>{
        const data = snap.val();
        if(data) applyRemoteState(data);
        else render();
      }, err=>console.error('Firebase read failed:', err));
    }
    render();
  }).catch(err=>{
    state.connecting = false;
    console.error('Firebase auth failed:', err);
    alert('Could not connect — make sure Anonymous sign-in is enabled in your Firebase console (Authentication → Sign-in method).');
    render();
  });
}

   STATE
   ========================================================= */
let state = {
  role: null,             // 'admin' | 'viewer'
  matchCode: null,
  connected: false,
  connecting: false,
  connectError: null,
  showQrModal: false,
  savedRosters: null,
  tempRosterSaveName: { A:'', B:'' },
  tempRole: 'admin',
  tempCode: generateMatchCode(),
  tempPassword: '',
  scorerPasswordHash: null,
  view: 'setup',
  step: 1,
  format: 'T20',
  maxOvers: 20,
  venue: '',
  pitch: 'Dry',
  weather: 'Clear',
  teamA: { name: 'Team A', players: makeDefaultPlayers('A'), substitutes: makeSubstitutes('A') },
  teamB: { name: 'Team B', players: makeDefaultPlayers('B'), substitutes: makeSubstitutes('B') },
  tossWinner: null,
  tossDecision: null,
  strikerId: null, nonStrikerId: null, bowlerId: null,
  previousBowlerId: null,
  innings: [],           // array of innings objects
  currentInnings: 0,
  freeHit: false,
  matchComplete: false,
  history: [],           // undo stack: serialized snapshots
  modal: null            // {type:'wicket'|'newBatsman'|'newBowler'|'runOut', payload}
};

const BOWLING_ROLES = ['Fast','Fast Medium','Medium Fast','Medium','Off Spin','Leg Spin','Left-arm Orthodox','Left-arm Chinaman','—'];

function makeDefaultPlayers(prefix){
  const arr = [];
  for(let i=1;i<=11;i++){
    arr.push({ id: prefix+i, name: '', battingStyle:'RHB', bowlingRole:'Fast' });
  }
  return arr;
}
function makeSubstitutes(prefix){
  const arr = [];
  for(let i=1;i<=2;i++){
    arr.push({ id: prefix+'SUB'+i, name: '', battingStyle:'RHB', bowlingRole:'Fast', isSub:true });
  }
  return arr;
}
function getMaxOversPerBowler(){
  switch(state.format){
    case 'T10': return 2;
    case 'T20': return 4;
    case 'ODI': return 10;
    case 'Test': return Infinity;
    default: return Math.max(1, Math.ceil(state.maxOvers/5));
  }
}

function freshInnings(battingTeam, bowlingTeam, target){
  return {
    battingTeam, bowlingTeam,
    deliveries: [],
    fow: [],
    target: target || null,
    battingOrderInPlay: [],
    outBatsmen: {},
    dismissedOrder: []
  };
}

/* =========================================================
   ENGINE HELPERS
   ========================================================= */
function currentInnings(){ return state.innings[state.currentInnings]; }

function teamById(id){
  return id.startsWith(playerTeamPrefix('A')) ? state.teamA : state.teamB;
}
function playerTeamPrefix(x){ return x; }

function getTeam(teamKey){ return teamKey === 'A' ? state.teamA : state.teamB; }

function findPlayer(id){
  if(!id) return null;
  const pools = [state.teamA.players, state.teamA.substitutes, state.teamB.players, state.teamB.substitutes];
  for(const pool of pools){
    const found = pool.find(p=>p.id===id);
    if(found) return found;
  }
  return null;
}

function legalBallCount(inn){
  return inn.deliveries.filter(d=>d.legal).length;
}
function oversStr(inn){
  const legal = legalBallCount(inn);
  const overs = Math.floor(legal/6);
  const balls = legal%6;
  return overs+'.'+balls;
}
function teamTotal(inn){
  return inn.deliveries.reduce((s,d)=> s + d.runsOffBat + d.extraRuns, 0);
}
function teamWickets(inn){
  return inn.deliveries.filter(d=>d.wicket).length;
}
function battingStatsFor(inn, playerId){
  let runs=0, balls=0, fours=0, sixes=0;
  inn.deliveries.forEach(d=>{
    if(d.strikerId===playerId){
      if(d.extraType!=='Wd' && d.extraType!=='Nb') balls++;
      runs += d.runsOffBat;
      if(d.runsOffBat===4) fours++;
      if(d.runsOffBat===6) sixes++;
    }
  });
  return {runs, balls, fours, sixes, sr: balls>0 ? ((runs/balls)*100).toFixed(1) : '0.0'};
}
function bowlingStatsFor(inn, playerId){
  const balls = inn.deliveries.filter(d=>d.bowlerId===playerId && d.legal).length;
  const runs = inn.deliveries.filter(d=>d.bowlerId===playerId)
    .reduce((s,d)=> s + d.runsOffBat + (d.extraType==='Wd'||d.extraType==='Nb' ? d.extraRuns : 0), 0);
  const wkts = inn.deliveries.filter(d=>d.bowlerId===playerId && d.wicket && d.wicket.creditBowler).length;
  const overs = Math.floor(balls/6)+'.'+(balls%6);
  const econ = balls>0 ? (runs/(balls/6)).toFixed(2) : '0.00';
  let maidens=0;
  const overGroups = {};
  inn.deliveries.filter(d=>d.bowlerId===playerId).forEach(d=>{
    overGroups[d.overNum] = overGroups[d.overNum] || [];
    overGroups[d.overNum].push(d);
  });
  Object.values(overGroups).forEach(g=>{
    const legalInOver = g.filter(d=>d.legal).length;
    const runsInOver = g.reduce((s,d)=>s+d.runsOffBat+d.extraRuns,0);
    if(legalInOver===6 && runsInOver===0) maidens++;
  });
  return {overs, runs, wkts, econ, maidens};
}

function pushHistory(){
  state.history.push(JSON.stringify({
    innings: state.innings, currentInnings: state.currentInnings,
    strikerId: state.strikerId, nonStrikerId: state.nonStrikerId, bowlerId: state.bowlerId,
    freeHit: state.freeHit
  }));
  if(state.history.length>60) state.history.shift();
}
function undo(){
  if(state.history.length===0) return;
  const snap = JSON.parse(state.history.pop());
  state.innings = snap.innings;
  state.currentInnings = snap.currentInnings;
  state.strikerId = snap.strikerId;
  state.nonStrikerId = snap.nonStrikerId;
  state.bowlerId = snap.bowlerId;
  state.freeHit = snap.freeHit;
  render();
}

/* ---- core delivery logic ---- */
function recordDelivery(partial){
  const inn = currentInnings();
  const overNum = Math.floor(legalBallCount(inn)/6) + 1;
  const d = Object.assign({
    overNum,
    strikerId: state.strikerId,
    nonStrikerId: state.nonStrikerId,
    bowlerId: state.bowlerId,
    runsOffBat: 0,
    extraType: null,
    extraRuns: 0,
    legal: true,
    wicket: null,
    wasFreeHit: state.freeHit
  }, partial);
  inn.deliveries.push(d);
  return d;
}

function swapStrike(){
  const t = state.strikerId; state.strikerId = state.nonStrikerId; state.nonStrikerId = t;
}

function checkOverComplete(){
  const inn = currentInnings();
  const legal = legalBallCount(inn);
  if(legal>0 && legal%6===0){
    swapStrike();
    state.previousBowlerId = state.bowlerId;
    state.bowlerId = null;
  }
}

function bowlRuns(runs){
  pushHistory();
  recordDelivery({ runsOffBat: runs, legal:true });
  state.freeHit = false;
  if(runs%2===1) swapStrike();
  checkOverComplete();
  if(state.bowlerId===null && !state.modal) state.modal = { type:'newBowler' };
  maybeEndInnings();
  render();
}

function bowlExtra(type){
  if(type==='Wd'){ openWideModal(); return; }
  if(type==='Nb'){ openNoBallModal(); return; }
  if(type==='B' || type==='Lb'){ openByeModal(type); return; }
}

function openWideModal(){
  state.modal = { type:'wide' };
  render();
}
function confirmWide(additionalRuns){
  pushHistory();
  recordDelivery({ extraType:'Wd', extraRuns: 1 + additionalRuns, runsOffBat:0, legal:false });
  if(additionalRuns%2===1) swapStrike();
  state.modal = null;
  maybeEndInnings();
  render();
}

function openNoBallModal(){
  state.modal = { type:'noball' };
  render();
}
function confirmNoBall(runsOffBat){
  pushHistory();
  recordDelivery({ extraType:'Nb', extraRuns:1, runsOffBat, legal:false });
  state.freeHit = true;
  if(runsOffBat%2===1) swapStrike();
  state.modal = null;
  maybeEndInnings();
  render();
}

function openByeModal(type){
  state.modal = { type:'byes', extraType:type };
  render();
}
function confirmByes(type, runs){
  pushHistory();
  recordDelivery({ extraType:type, extraRuns:runs, legal:true });
  if(runs%2===1) swapStrike();
  checkOverComplete();
  state.modal = state.bowlerId===null ? { type:'newBowler' } : null;
  maybeEndInnings();
  render();
}

function openWicketModal(){
  state.modal = { type:'wicket' };
  render();
}
function confirmWicket(dismissalType, fielderId, runOutInfo){
  pushHistory();
  const creditBowler = ['Bowled','Caught','LBW','Stumped','Hit Wicket'].includes(dismissalType);
  const isFreeHitProtected = state.freeHit && ['Bowled','Caught','LBW','Stumped','Hit Wicket'].includes(dismissalType) && dismissalType!=='Run Out';
  if(isFreeHitProtected){
    state.modal=null;
    render();
    return;
  }
  const inn = currentInnings();
  let dismissedId = state.strikerId;
  let runsCompleted = 0;
  let legal = true;
  let runsOffBat = 0;

  if(dismissalType==='Run Out'){
    dismissedId = runOutInfo.who;
    runsCompleted = runOutInfo.runsCompleted || 0;
    runsOffBat = runsCompleted;
  }

  recordDelivery({
    runsOffBat, legal,
    wicket: { dismissedId, dismissalType, fielderId: fielderId||null, creditBowler }
  });
  inn.fow.push({
    wicketNum: teamWickets(inn),
    score: teamTotal(inn),
    player: findPlayer(dismissedId)?.name || dismissedId,
    over: oversStr(inn)
  });
  inn.dismissedOrder.push(dismissedId);

  if(dismissalType==='Run Out' && runsCompleted%2===1) swapStrike();

  if(dismissedId===state.strikerId){
    state.strikerId = null;
  } else {
    state.nonStrikerId = null;
  }
  state.modal = { type:'newBatsman', outId: dismissedId };
  checkOverComplete();
  maybeEndInnings();
  render();
}

function confirmNewBatsman(playerId){
  if(state.strikerId===null) state.strikerId = playerId;
  else state.nonStrikerId = playerId;
  state.modal = state.bowlerId===null ? {type:'newBowler'} : null;
  render();
}
function confirmNewBowler(playerId){
  state.bowlerId = playerId;
  state.modal = (state.strikerId===null || state.nonStrikerId===null) ? {type:'newBatsman', outId:null} : null;
  render();
}

function maybeEndInnings(){
  const inn = currentInnings();
  const wkts = teamWickets(inn);
  const overs = legalBallCount(inn)/6;
  const total = teamTotal(inn);
  const allOut = wkts>=10;
  const oversDone = overs>=state.maxOvers;
  const chased = inn.target!==null && total>=inn.target;
  if(allOut || oversDone || chased){
    if(state.currentInnings===0){
      const bat2 = inn.bowlingTeam, bowl2 = inn.battingTeam;
      state.innings.push(freshInnings(bat2, bowl2, teamTotal(inn)+1));
      state.currentInnings = 1;
      state.strikerId=null; state.nonStrikerId=null; state.bowlerId=null; state.freeHit=false;
      state.modal = {type:'newBatsman', outId:null, openers:true};
    } else {
      state.view = 'viewer';
      state.modal = null;
      state.matchComplete = true;
    }
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(!state.connected){
    app.appendChild(renderConnectGate());
    attachQRCodes();
    return;
  }
  pushStateToFirebase();
  app.appendChild(renderTopline());
  if(state.role==='viewer' && state.innings.length===0){
    app.appendChild(renderWaiting());
  } else {
    if(state.view==='setup') app.appendChild(renderSetup());
    if(state.view==='scorer') app.appendChild(renderScorer());
    if(state.view==='viewer') app.appendChild(renderViewer());
  }
  if(state.modal) app.appendChild(renderModal());
  if(state.showQrModal) app.appendChild(renderQrModal());
  attachQRCodes();
}

  if(step===3){
    wrap.appendChild(el('h2','The toss'));
    wrap.appendChild(fieldChoice('Who won the toss?', [state.teamA.name||'Team A', state.teamB.name||'Team B'], state.tossWinner, v=>{state.tossWinner=v; render();}));
    wrap.appendChild(fieldChoice('Elected to', ['Bat','Bowl'], state.tossDecision, v=>{state.tossDecision=v; render();}));
  }

  if(step===4){
    wrap.appendChild(el('h2','Opening selection'));
    const battingFirst = decideBattingTeam();
    const bowlingFirst = battingFirst===state.teamA ? state.teamB : state.teamA;
    wrap.appendChild(el('div','helptext', (battingFirst.name||'Batting team') + ' bats first, ' + (bowlingFirst.name||'bowling team') + ' bowls first.'));
    wrap.appendChild(playerSelectField('Striker', battingFirst.players, state.strikerId, v=>state.strikerId=v));
    wrap.appendChild(playerSelectField('Non-striker', battingFirst.players.filter(p=>p.id!==state.strikerId), state.nonStrikerId, v=>state.nonStrikerId=v));
    wrap.appendChild(playerSelectField('Opening bowler', bowlingFirst.players, state.bowlerId, v=>state.bowlerId=v));
  }

  const actions = el('div','wizard-actions');
  const back = el('button','btn btn-ghost','Back');
  back.disabled = step===1;
  back.onclick = ()=>{ state.step=Math.max(1,step-1); render(); };
  const next = el('button','btn btn-primary', step<4 ? 'Continue' : 'Start match');
  next.onclick = ()=>{
    if(step<4){ state.step++; render(); }
    else startMatch();
  };
  actions.appendChild(back); actions.appendChild(next);
  wrap.appendChild(actions);
  return wrap;
}

function decideBattingTeam(){
  if(!state.tossWinner) return state.teamA;
  const winnerTeam = state.tossWinner===(state.teamA.name||'Team A') ? state.teamA : state.teamB;
  const otherTeam = winnerTeam===state.teamA ? state.teamB : state.teamA;
  if(state.tossDecision==='Bat') return winnerTeam;
  if(state.tossDecision==='Bowl') return otherTeam;
  return state.teamA;
}

function startMatch(){
  const battingFirst = decideBattingTeam();
  const bowlingFirst = battingFirst===state.teamA ? state.teamB : state.teamA;
  state.innings = [ freshInnings(battingFirst===state.teamA?'A':'B', bowlingFirst===state.teamA?'A':'B', null) ];
  state.currentInnings = 0;
  state.view = 'scorer';
  render();
}

function renderScorer(){
  const inn = currentInnings();
  const frag = el('div');
  const battingTeam = getTeam(inn.battingTeam);
  const bowlingTeam = getTeam(inn.bowlingTeam);

  const board = el('div','board');
  const top = el('div','board-top');
  const left = el('div');
  left.appendChild(el('div','board-teams', battingTeam.name+' vs '+bowlingTeam.name+' · Innings '+(state.currentInnings+1)));
  left.appendChild(el('div','board-score num', teamTotal(inn)+' / '+teamWickets(inn)));
  const crr = legalBallCount(inn)>0 ? (teamTotal(inn)/(legalBallCount(inn)/6)).toFixed(2) : '0.00';
  left.appendChild(el('div','board-sub', oversStr(inn)+' overs · CRR '+crr + (inn.target ? ' · Target '+inn.target : '')));

  if(inn.target){

    const ballsLeft = state.maxOvers*6 - legalBallCount(inn);
    const rrr = ballsLeft>0 ? (remaining/(ballsLeft/6)).toFixed(2) : '—';
    rStat.appendChild(el('div','label','need'));
    rStat.appendChild(el('div','value num', Math.max(remaining,0)+' off '+ballsLeft));
    rStat.appendChild(el('div','label','RRR '+rrr));
  } else {
    rStat.appendChild(el('div','label','target'));
    rStat.appendChild(el('div','value num','—'));
  }
  top.appendChild(rStat);
  board.appendChild(top);

  if(state.freeHit) board.appendChild(el('div','freehit-banner','FREE HIT — next legal ball'));

  const mid = el('div','board-mid');
  const strikePanel = el('div','player-panel');
  strikePanel.appendChild(el('div','panel-title','BATTING'));
  [state.strikerId, state.nonStrikerId].forEach(pid=>{
    if(!pid) return;
    const p = findPlayer(pid);
    const st = battingStatsFor(inn, pid);
    const line = el('div','p-line');
    line.appendChild(el('span','name'+(pid===state.strikerId?' strike':''), p?.name||pid));
    line.appendChild(el('span','figs num', st.runs+' ('+st.balls+') SR '+st.sr));
    strikePanel.appendChild(line);
  });
  mid.appendChild(strikePanel);

  const bowlPanel = el('div','player-panel');
  bowlPanel.appendChild(el('div','panel-title','BOWLING'));
  if(state.bowlerId){
    const p = findPlayer(state.bowlerId);
    const bs = bowlingStatsFor(inn, state.bowlerId);
    const maxOv = getMaxOversPerBowler();
    const line = el('div','p-line');
    line.appendChild(el('span','name', p?.name||state.bowlerId));
    line.appendChild(el('span','figs num', bs.overs+'-'+bs.maidens+'-'+bs.runs+'-'+bs.wkts));
    bowlPanel.appendChild(line);
    if(isFinite(maxOv)){
      bowlPanel.appendChild(el('div','p-line', '<span style="font-size:11px;color:#94a3b8;">Limit '+bs.overs+' / '+maxOv+' overs</span>'));
    }
  }
  const legal = legalBallCount(inn);
  const thisOverBalls = inn.deliveries.filter(d=> d.overNum===Math.floor(legal/6)+1 );
  const timeline = el('div','over-timeline');
  thisOverBalls.forEach(d=>{
    let label, cls='ball-pill';
    if(d.extraType==='Wd'){
      const additional = d.extraRuns - 1;
      label = 'Wd' + (additional>0 ? '+'+additional : '');
      cls+=' x';
    } else if(d.extraType==='Nb'){
      label = 'Nb' + (d.runsOffBat>0 ? '+'+d.runsOffBat : '');
      cls+=' x';
    } else if(d.extraType==='B' || d.extraType==='Lb'){
      label = d.extraType + d.extraRuns;
      cls+=' x';
    } else {
      label = d.runsOffBat.toString();
    }
    if(d.wicket){ label='W'; cls+=' w'; }
    timeline.appendChild(el('div',cls,label));
  });
  bowlPanel.appendChild(timeline);
  mid.appendChild(bowlPanel);
  board.appendChild(mid);
  frag.appendChild(board);

  if(state.role!=='admin'){
    return frag;
  }

  const controls = el('div','controls');
  const topCtrl = el('div','ctrl-toprow');
  topCtrl.appendChild(el('div','serif','Log delivery'));
  const undoBtn = el('button','chip undo','Undo');
  undoBtn.onclick = undo;
  topCtrl.appendChild(undoBtn);
  controls.appendChild(topCtrl);

  const runsSec = el('div','ctrl-section');
  runsSec.appendChild(el('div','ctrl-label','RUNS OFF BAT'));
  const runsRow = el('div','chip-row');
  [0,1,2,3,4,6].forEach(r=>{
    const b = el('button','chip', r);
    b.onclick = ()=>bowlRuns(r);
    runsRow.appendChild(b);
  });
  runsSec.appendChild(runsRow);
  controls.appendChild(runsSec);

  const extrasSec = el('div','ctrl-section');
  extrasSec.appendChild(el('div','ctrl-label','EXTRAS'));
  const extrasRow = el('div','chip-row');
  [['Wd','Wide'],['Nb','No ball'],['B','Bye'],['Lb','Leg bye']].forEach(([code,label])=>{
    const b = el('button','chip extra', label);
    b.onclick = ()=>bowlExtra(code);
    extrasRow.appendChild(b);
  });
  extrasSec.appendChild(extrasRow);
  controls.appendChild(extrasSec);

  const wicketSec = el('div','ctrl-section');
  wicketSec.appendChild(el('div','ctrl-label','WICKET'));
  const wRow = el('div','chip-row');
  const wBtn = el('button','chip wicket','W — Wicket');
  wBtn.onclick = openWicketModal;
  wRow.appendChild(wBtn);
  wicketSec.appendChild(wRow);
  controls.appendChild(wicketSec);

  frag.appendChild(controls);
  return frag;
}

    const actions = el('div','modal-actions');
    const confirm = el('button','btn btn-primary','Confirm');
    confirm.onclick = ()=>confirmNewBatsman(sel.value);
    actions.appendChild(confirm);
    m.appendChild(actions);
  }

  if(state.modal.type==='newBowler'){
    m.appendChild(el('h3','Next over — select bowler'));
    const bowlingTeam = getTeam(inn.bowlingTeam);
    const maxOv = getMaxOversPerBowler();
    const eligible = bowlingTeam.players.filter(p=>{
      if(p.id===state.previousBowlerId) return false;
      const oversBowled = parseInt(bowlingStatsFor(inn, p.id).overs.split('.')[0]);
      return oversBowled < maxOv;
    });
    const list = eligible.length ? eligible : bowlingTeam.players.filter(p=>p.id!==state.previousBowlerId);
    if(!eligible.length){
      m.appendChild(el('div','helptext','Every other bowler has reached the '+maxOv+'-over limit for '+state.format+' — showing remaining options anyway.'));
    }
    const sel = el('select');
    list.forEach(p=>{
      const bs = bowlingStatsFor(inn, p.id);
      const label = (p.name||p.id) + (isFinite(maxOv) ? ' — '+bs.overs+'/'+maxOv+' ov bowled' : '');
      const opt=el('option','',label); opt.value=p.id; sel.appendChild(opt);
    });
    m.appendChild(sel);
    const actions = el('div','modal-actions');
    const confirm = el('button','btn btn-primary','Confirm');
    confirm.onclick = ()=>confirmNewBowler(sel.value);
    actions.appendChild(confirm);
    m.appendChild(actions);
  }

  backdrop.appendChild(m);
  return backdrop;
}

/* ---------------- VIEWER SCORECARD ---------------- */
function cumulativeRunsByOver(inn){
  const points = [{x:0, y:0}];
  let cum = 0, legal = 0;
  inn.deliveries.forEach(d=>{
    cum += d.runsOffBat + d.extraRuns;
    if(d.legal) legal++;
    points.push({x: legal/6, y: cum});
  });
  return points;
}

function buildWormChart(){
  const dataSets = state.innings.map((inn,idx)=>({
    label: getTeam(inn.battingTeam).name || ('Team '+(idx+1)),
    points: cumulativeRunsByOver(inn),
    color: idx===0 ? '#10b981' : '#38bdf8'
  })).filter(ds=>ds.points.length>1);
  if(!dataSets.length) return null;

  const maxX = Math.max(state.maxOvers, ...dataSets.map(ds=>ds.points[ds.points.length-1].x));
  const maxY = Math.max(10, ...dataSets.map(ds=>Math.max(...ds.points.map(p=>p.y)))) * 1.1;
  const width=600, height=240, padL=38, padR=14, padT=14, padB=28;
  const plotW = width-padL-padR, plotH = height-padT-padB;
  const xScale = x => padL + (x/maxX)*plotW;
  const yScale = y => padT + plotH - (y/maxY)*plotH;

  let svg = '<svg viewBox="0 0 '+width+' '+height+'" style="width:100%;height:auto;">';
  svg += '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+plotH)+'" stroke="#334155" stroke-width="1"/>';
  svg += '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(padL+plotW)+'" y2="'+(padT+plotH)+'" stroke="#334155" stroke-width="1"/>';
  const xStep = maxX>40 ? 10 : maxX>15 ? 5 : 2;
  for(let o=0; o<=maxX; o+=xStep){
    const x = xScale(o);
    svg += '<line x1="'+x+'" y1="'+(padT+plotH)+'" x2="'+x+'" y2="'+(padT+plotH+4)+'" stroke="#334155"/>';
    svg += '<text x="'+x+'" y="'+(padT+plotH+16)+'" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="Space Mono, monospace">'+o+'</text>';
  }
  const yStep = Math.max(10, Math.ceil(maxY/4/10)*10);
  for(let r=0; r<=maxY; r+=yStep){
    const y = yScale(r);
    svg += '<text x="'+(padL-6)+'" y="'+(y+3)+'" font-size="9" fill="#94a3b8" text-anchor="end" font-family="Space Mono, monospace">'+r+'</text>';
  }
  dataSets.forEach(ds=>{
    const pathD = ds.points.map((p,i)=> (i===0?'M':'L')+xScale(p.x).toFixed(1)+','+yScale(p.y).toFixed(1)).join(' ');
    svg += '<path d="'+pathD+'" fill="none" stroke="'+ds.color+'" stroke-width="2.5" stroke-linecap="round"/>';
  });
  svg += '</svg>';
  return { svg, dataSets };
}

function matchBattingLeaders(){
  const all = [];
  state.innings.forEach(inn=>{
    const team = getTeam(inn.battingTeam);
    const facedIds = [...new Set(inn.deliveries.map(d=>d.strikerId))];
    team.players.concat(team.substitutes||[]).filter(p=>facedIds.includes(p.id)).forEach(p=>{
      const st = battingStatsFor(inn,p.id);
      all.push({ name: p.name||p.id, runs: st.runs, balls: st.balls });
    });
  });
  return all.sort((a,b)=>b.runs-a.runs).slice(0,3);
}
function matchBowlingLeaders(){
  const all = [];
  state.innings.forEach(inn=>{
    const team = getTeam(inn.bowlingTeam);
    const bowledIds = [...new Set(inn.deliveries.map(d=>d.bowlerId))];
    team.players.concat(team.substitutes||[]).filter(p=>bowledIds.includes(p.id)).forEach(p=>{
      const bs = bowlingStatsFor(inn,p.id);
      all.push({ name: p.name||p.id, wkts: bs.wkts, runs: bs.runs, overs: bs.overs });
    });
  });
  return all.sort((a,b)=> b.wkts-a.wkts || a.runs-b.runs).slice(0,3);
}

async function generateScorecardImage(){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080, H=1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#10b981';
  ctx.fillRect(0,0,W,12);

  const inn1 = state.innings[0], inn2 = state.innings[1];
  const team1 = getTeam(inn1.battingTeam), team2 = getTeam(inn2.battingTeam);

  let y = 90;
  ctx.fillStyle = '#94a3b8';
  ctx.font = '600 28px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('FINAL SCORECARD', W/2, y);

  y += 70;
  ctx.fillStyle = '#f8fafc';
  ctx.font = '800 46px Inter, sans-serif';
  ctx.fillText((team1.name||'Team A')+' vs '+(team2.name||'Team B'), W/2, y);

  y += 90;
  [[team1,inn1],[team2,inn2]].forEach(([team,inn])=>{
    ctx.font = '600 32px Inter, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'left';
    ctx.fillText(team.name||'Team', 90, y);
    ctx.textAlign = 'right';
    ctx.font = "700 40px 'Space Mono', monospace";
    ctx.fillStyle = '#10b981';
    ctx.fillText(teamTotal(inn)+'/'+teamWickets(inn)+'  ('+oversStr(inn)+' ov)', W-90, y);
    y += 60;
  });

  y += 20;
  const t1 = teamTotal(inn1), t2 = teamTotal(inn2);
  let resultText;
  if(t2>t1) resultText = (team2.name||'Team 2')+' won by '+(10-teamWickets(inn2))+' wickets';
  else if(t1>t2) resultText = (team1.name||'Team 1')+' won by '+(t1-t2)+' runs';
  else resultText = 'Match tied';
  ctx.textAlign = 'center';
  ctx.font = '700 30px Inter, sans-serif';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText(resultText, W/2, y);

  y += 70;
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(90,y); ctx.lineTo(W-90,y); ctx.stroke();

  y += 60;
  ctx.textAlign = 'left';
  ctx.font = '700 26px Inter, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('TOP BATTING', 90, y);
  y += 50;
  matchBattingLeaders().forEach(b=>{
    ctx.font = '600 28px Inter, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'left';
    ctx.fillText(b.name, 90, y);
    ctx.font = "700 28px 'Space Mono', monospace";
    ctx.fillStyle = '#10b981';
    ctx.textAlign = 'right';
    ctx.fillText(b.runs+' ('+b.balls+')', W-90, y);
    y += 48;
  });

  y += 30;
  ctx.textAlign = 'left';
  ctx.font = '700 26px Inter, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('TOP BOWLING', 90, y);
  y += 50;
  matchBowlingLeaders().forEach(b=>{
    ctx.font = '600 28px Inter, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'left';
    ctx.fillText(b.name, 90, y);
    ctx.font = "700 28px 'Space Mono', monospace";
    ctx.fillStyle = '#38bdf8';
    ctx.textAlign = 'right';
    ctx.fillText(b.wkts+'/'+b.runs+' ('+b.overs+')', W-90, y);
    y += 48;
  });

  ctx.textAlign = 'center';
  ctx.font = '500 22px Inter, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('Scored live with Scoreboard', W/2, H-50);

  return new Promise(resolve=>{ canvas.toBlob(blob=>resolve(blob), 'image/png'); });
}

async function shareScorecardImage(){
  const blob = await generateScorecardImage();
  if(!blob) return;
  const file = new File([blob], 'scorecard.png', { type:'image/png' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:'Match scorecard' }); return; }
    catch(e){}
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'scorecard.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function renderViewer(){
  const frag = el('div');
  state.innings.forEach((inn, idx)=>{
    const battingTeam = getTeam(inn.battingTeam);
    const bowlingTeam = getTeam(inn.bowlingTeam);
    const paper = el('div','paper');
    paper.appendChild(el('div','innings-tag','INNINGS '+(idx+1)));
    paper.appendChild(el('h3', battingTeam.name+' — '+teamTotal(inn)+'/'+teamWickets(inn)+' ('+oversStr(inn)+' ov)'));

    const table = el('table');
    const thead = el('thead');
    thead.innerHTML = '<tr><th>Batter</th><th>Dismissal</th><th class="num">R</th><th class="num">B</th><th class="num">4s</th><th class="num">6s</th><th class="num">SR</th></tr>';
    table.appendChild(thead);
    const tbody = el('tbody');
    const facedIds = [...new Set(inn.deliveries.map(d=>d.strikerId))];
    battingTeam.players.concat(battingTeam.substitutes || []).filter(p=>facedIds.includes(p.id)).forEach(p=>{
      const st = battingStatsFor(inn, p.id);
      const outInfo = inn.deliveries.find(d=>d.wicket && d.wicket.dismissedId===p.id);
      let dismissal = 'not out';
      if(outInfo){
        const fielder = outInfo.wicket.fielderId ? findPlayer(outInfo.wicket.fielderId) : null;
        dismissal = outInfo.wicket.dismissalType + (fielder ? ' (' + (fielder.name||fielder.id) + ')' : '');
      }
      const tr = el('tr');
      tr.innerHTML = '<td style="font-weight:600;color:#ffffff;">'+(p.name||p.id)+'</td><td class="dismissal">'+dismissal+'</td>'+
        '<td class="num" style="font-weight:700;color:#34d399;">'+st.runs+'</td><td class="num">'+st.balls+'</td>'+
        '<td class="num">'+st.fours+'</td><td class="num">'+st.sixes+'</td><td class="num">'+st.sr+'</td>';
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    paper.appendChild(table);

    if(inn.fow.length){
      paper.appendChild(el('div','team-list-title','Fall of wickets'));
      const fowLine = inn.fow.map(f=> f.score+'-'+(inn.fow.indexOf(f)+1)+' ('+f.player+', '+f.over+' ov)').join('  ·  ');
      paper.appendChild(el('div','fow-row', fowLine));
    }

    paper.appendChild(el('div','team-list-title','Bowling — '+bowlingTeam.name));
    const btable = el('table');
    const bthead = el('thead');
    bthead.innerHTML = '<tr><th>Bowler</th><th class="num">O</th><th class="num">M</th><th class="num">R</th><th class="num">W</th><th class="num">Econ</th></tr>';
    btable.appendChild(bthead);
    const btbody = el('tbody');
    const bowledIds = [...new Set(inn.deliveries.map(d=>d.bowlerId))];
    bowlingTeam.players.concat(bowlingTeam.substitutes || []).filter(p=>bowledIds.includes(p.id)).forEach(p=>{
      const bs = bowlingStatsFor(inn, p.id);
      const tr = el('tr');
      tr.innerHTML = '<td style="font-weight:600;color:#ffffff;">'+(p.name||p.id)+'</td><td class="num">'+bs.overs+'</td><td class="num">'+bs.maidens+'</td><td class="num">'+bs.runs+'</td><td class="num" style="font-weight:700;color:#38bdf8;">'+bs.wkts+'</td><td class="num">'+bs.econ+'</td>';
      btbody.appendChild(tr);
    });
    btable.appendChild(btbody);
    paper.appendChild(btable);
    frag.appendChild(paper);
  });

  const worm = buildWormChart();
  if(worm){
    const wormPaper = el('div','paper');
    wormPaper.appendChild(el('h3','Run progression'));
    const legend = el('div','', worm.dataSets.map(ds=>
      '<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:12px;color:#cbd5e1;font-weight:600;">'+
      '<span style="width:12px;height:12px;border-radius:3px;background:'+ds.color+';display:inline-block;"></span>'+ds.label+'</span>'
    ).join(''));
    legend.style.marginBottom = '12px';
    wormPaper.appendChild(legend);
    const svgWrap = el('div');
    svgWrap.innerHTML = worm.svg;
    wormPaper.appendChild(svgWrap);
    frag.appendChild(wormPaper);
  }

  if(state.matchComplete && state.innings.length===2){
    const inn1 = state.innings[0], inn2 = state.innings[1];
    const t1 = teamTotal(inn1), t2 = teamTotal(inn2);
    const team1 = getTeam(inn1.battingTeam), team2 = getTeam(inn2.battingTeam);
    const summary = el('div','paper');
    let text;
    if(t2>t1) text = (team2.name||'Team 2')+' won by '+(10-teamWickets(inn2))+' wickets';
    else if(t1>t2) text = (team1.name||'Team 1')+' won by '+(t1-t2)+' runs';
    else text = 'Match tied';
    summary.appendChild(el('h3','Result'));
    summary.appendChild(el('div','', '<span style="font-size:18px;font-weight:700;color:#fbbf24;">'+text+'</span>'));
    const shareBtn = el('button','btn btn-primary','Share Scorecard Image');
    shareBtn.style.marginTop = '16px';
    shareBtn.onclick = ()=>{ shareScorecardImage(); };
    summary.appendChild(shareBtn);
    frag.appendChild(summary);
  } else if(state.innings.length===2 && !state.matchComplete){
    const paper = el('div','paper');
    paper.appendChild(el('div','empty-note','Match in progress — result will appear once the second innings finishes.'));
    frag.appendChild(paper);
  }

  if(state.innings.length===0){
    const paper = el('div','paper');
    paper.appendChild(el('div','empty-note','No innings data yet — set up and start a match to see the scorecard.'));
    frag.appendChild(paper);
  }
  return frag;
}

(function prefillFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get('code');
  if(codeParam){
    state.tempCode = codeParam.toUpperCase();
    state.tempRole = 'viewer';
  }
})();
render();
</script>
